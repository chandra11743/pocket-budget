const idb = (()=>{ let dbp=null; const open=()=>dbp||(dbp=new Promise((res,rej)=>{ const r=indexedDB.open('pocketBudget',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }));
  const tx=(mode,fn)=>open().then(db=>new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const st=t.objectStore('kv'); const q=fn(st); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); }));
  return { get:k=>tx('readonly',s=>s.get(k)).catch(()=>null), set:(k,v)=>tx('readwrite',s=>s.put(v,k)).catch(()=>null), del:k=>tx('readwrite',s=>s.delete(k)).catch(()=>null) };
})();
let SH = null, syncState='none', syncTimer=null, syncing=false;
function exportObj(){ return {app:'pocket-budget', version:1, profileName:curProfile().name, currency:curCode(), homeCur:curProfile().homeCur||'', exported:new Date().toISOString(), entries:DB.entries, months:DB.months, rates:DB.rates, settings:DB.settings}; }
function merge(r, cloud){
  if(!r || typeof r!=='object' || !r.entries || typeof r.entries!=='object') throw new Error('Not a Pocket Budget file');
  if(!cloud && r.profileName && r.profileName.trim().toLowerCase()!==curProfile().name.trim().toLowerCase())
    throw new Error(`this file belongs to "${r.profileName}". Switch to that profile first (or rename this profile to "${r.profileName}")`);
  if(r.currency && r.currency!==curCode())
    throw new Error(`this file is in ${r.currency} but this profile uses ${curCode()}. Set the profile's currency to ${r.currency} first`);
  let n=0; const bad=k=>k==='__proto__'||k==='constructor'||k==='prototype';
  for(const [id,e] of Object.entries(r.entries)){ if(bad(id) || !e || typeof e!=='object' || typeof e.date!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(e.date) || typeof e.amt!=='number') continue;
    const l=DB.entries[id]; if(!l || (e.upd||0)>(l.upd||0)){ DB.entries[id]=e; n++; } }
  for(const [m,c] of Object.entries(r.months||{})){ if(bad(m) || !c || typeof c!=='object' || !/^\d{4}-\d{2}$/.test(m)) continue; const l=DB.months[m]; if(!l || (c.upd||0)>(l.upd||0)){ DB.months[m]=c; n++; } }
  for(const [d,v] of Object.entries(r.rates||{})) if(!DB.rates[d]) DB.rates[d]=v;
  if(r.settings && typeof r.settings==='object' && !Array.isArray(r.settings) && (r.settings.upd||0)>(DB.settings.upd||0)){ DB.settings=Object.assign({upd:0, theme:'auto'}, r.settings); applyTheme(); buildCats(); n++; }
  return n;
}
function slug(n){ return (n||'me').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'me'; }
function syncFileName(){ return `pocket-budget-backup-${slug(curProfile().name)}-${todayStr()}.json`; }
/* ============ Sync: Sign in with Google → a hidden app folder in the person's OWN Google Drive ============
   Uses the drive.appdata permission only: the app can see its own file and nothing else in your Drive,
   and nobody else (including whoever made the app) can see it. No server: the phone talks to Google directly. */
const APP_VERSION='v1';
const GOOGLE_CLIENT_ID = '';   // OAuth client (type: Web application) whose authorised origin + redirect is this page
const G_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
const G_API='https://www.googleapis.com/drive/v3', G_UP='https://www.googleapis.com/upload/drive/v3';
const GSTATE='pocketBudget.gstate', GSILENT='pocketBudget.gsilent';
const gKey = pid => 'pocketBudget.google.'+(pid||PROFILES.current);
function gCfg(){ try{ const o=JSON.parse(localStorage.getItem(gKey())||'null'); return o && typeof o==='object' && !Array.isArray(o)? o : null; }catch(e){ return null; } }
function gSave(o){ try{ localStorage.setItem(gKey(), JSON.stringify(o)); }catch(e){} }
function gClear(){ try{ localStorage.removeItem(gKey()); }catch(e){} }
function cloudOn(){ return !!gCfg(); }
function gTokenOk(){ const c=gCfg(); return !!(c && c.token && Date.now() < (+c.exp||0)-60000); }
let cloudErr='', cloudState='off', cloudBusy=false, cloudTimer=null, cloudAgain=false, cloudDirty=true, cloudManualWait=false, lblTimer=null, gVer=null, gFirst=true;
function initSync(){ gVer=null; gFirst=true; cloudDirty=true; cloudState=cloudOn()? (gTokenOk()?'ok':'expired') : 'off'; renderSyncDot(); if(cloudOn() && gTokenOk()) cloudSync(false); }
/* Sign-in: go to Google and come straight back with a short-lived token (1 hour). "state" proves the sign-in started here. */
function gRedirect(o={}){
  if(!GOOGLE_CLIENT_ID){ toast('Google sign-in isn’t switched on in this copy of the app yet'); return; }
  if(!navigator.onLine){ toast('You’re offline. Connect to the internet to sign in.'); return; }
  const st=uid()+uid()+uid();
  try{ localStorage.setItem(GSTATE, JSON.stringify({st, pid:PROFILES.current, t:Date.now(), silent:!!o.silent, restore:!!o.restore})); }catch(e){}
  const p=new URLSearchParams({client_id:GOOGLE_CLIENT_ID, redirect_uri:location.origin+location.pathname, response_type:'token', scope:G_SCOPE, include_granted_scopes:'true', state:st});
  const c=gCfg(); if(c && c.email) p.set('login_hint', c.email);
  if(o.silent) p.set('prompt','none'); else if(!c || !c.email) p.set('prompt','select_account');
  location.assign('https://accounts.google.com/o/oauth2/v2/auth?'+p.toString());
}
/* Coming back from Google: take the token only if this device started that sign-in (a link with someone else's token is ignored) */
function gTakeToken(){
  const h=location.hash||''; if(!/[#&](access_token|error)=/.test(h)) return null;
  const q=new URLSearchParams(h.slice(1)); try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  let sv=null; try{ sv=JSON.parse(localStorage.getItem(GSTATE)||'null'); localStorage.removeItem(GSTATE); }catch(e){}
  if(!sv || typeof sv.st!=='string' || q.get('state')!==sv.st || Date.now()-(+sv.t||0)>15*60000) return {bad:true};
  if(sv.pid!==PROFILES.current && PROFILES.list.some(p=>p.id===sv.pid)){ PROFILES.current=sv.pid; saveProfiles(); KEY=keyFor(sv.pid); DB=loadDB(); buildCats(); applyTheme(); renderProfileBtn(); }
  if(q.get('error')) return {error:q.get('error'), silent:!!sv.silent};
  const tok=q.get('access_token')||'', exp=Math.min(7200, Math.max(60, parseInt(q.get('expires_in'))||3600)), sc=q.get('scope')||G_SCOPE;
  if(!/^[A-Za-z0-9._~+\/=-]{20,4096}$/.test(tok)) return {bad:true};
  if(!sc.includes('drive.appdata')) return {error:'no_drive'};
  const c=gCfg()||{}; gSave({...c, email:c.email||'', token:tok, exp:Date.now()+exp*1000}); try{ localStorage.removeItem(GSILENT); }catch(e){}
  return {ok:true, restore:!!sv.restore, first:!c.email};
}
async function gFetch(url, opt={}){
  if(!gTokenOk()){ const e=new Error('Sign-in expired'); e.expired=true; throw e; }
  const c=gCfg(), ctl=('AbortController' in window)? new AbortController() : null, t=setTimeout(()=>{ try{ ctl&&ctl.abort(); }catch(e){} }, 25000);
  try{ const r=await fetch(url,{...opt, signal:ctl?ctl.signal:undefined, headers:{...(opt.headers||{}), Authorization:'Bearer '+c.token}});
    if(r.status===401){ const x=gCfg(); if(x) gSave({...x, token:null, exp:0}); const e=new Error('Sign-in expired'); e.expired=true; throw e; }
    if(!r.ok){ let m='Google Drive error '+r.status; try{ const j=await r.json(); if(j && j.error && j.error.message) m=j.error.message; }catch(_){} const e=new Error(m); e.status=r.status; throw e; }
    return r;
  } finally{ clearTimeout(t); }
}
function gFileName(){ return PROFILES.current==='default'? 'pocket-budget.json' : 'pocket-budget-'+slug(curProfile().name)+'.json'; }
async function gWho(){ try{ const j=await (await gFetch(G_API+'/about?fields=user(emailAddress,displayName)')).json(); const c=gCfg(); if(c && j.user){ gSave({...c, email:String(j.user.emailAddress||'').slice(0,200), gname:String(j.user.displayName||'').slice(0,80)}); renderCloudStatus(); } }catch(e){} }
async function gFindFile(){
  const c=gCfg(); if(c && c.fileId) return c.fileId;
  const q=encodeURIComponent(`name='${gFileName()}' and trashed=false`);
  const j=await (await gFetch(`${G_API}/files?spaces=appDataFolder&q=${q}&fields=files(id,version,modifiedTime)&orderBy=modifiedTime desc&pageSize=10`)).json();
  const id=(j.files && j.files[0] && j.files[0].id) || null; if(id) gSave({...gCfg(), fileId:id}); return id;
}
async function gCreate(body){
  const meta={name:gFileName(), parents:['appDataFolder'], mimeType:'application/json'}, bd='pb'+uid();
  const data=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
  const j=await (await gFetch(`${G_UP}/files?uploadType=multipart&fields=id,version`,{method:'POST', headers:{'Content-Type':'multipart/related; boundary='+bd}, body:data})).json();
  gSave({...gCfg(), fileId:j.id}); return j;
}
const gUpload = async (id, body) => (await gFetch(`${G_UP}/files/${encodeURIComponent(id)}?uploadType=media&fields=id,version`,{method:'PATCH', headers:{'Content-Type':'application/json'}, body})).json();
const gMeta = async id => (await gFetch(`${G_API}/files/${encodeURIComponent(id)}?fields=id,version`)).json();
const gDownload = async id => (await gFetch(`${G_API}/files/${encodeURIComponent(id)}?alt=media`,{cache:'no-store'})).json();
/* A new device with nothing logged takes the saved data as it is (settings, categories, currency) */
function adoptAndMerge(r){
  if(!r || typeof r!=='object') return 0;
  const fresh=!Object.values(DB.entries).some(e=>!e.del);
  if(fresh){ const p=curProfile();
    if(typeof r.currency==='string' && CURRENCIES[r.currency]) p.currency=r.currency;
    if(typeof r.homeCur==='string'){ if(CURRENCIES[r.homeCur] && r.homeCur!==p.currency) p.homeCur=r.homeCur; else delete p.homeCur; }
    if(typeof r.profileName==='string' && r.profileName.trim() && (p.name==='Me' || !DB.settings.setupDone)) p.name=r.profileName.trim().slice(0,24);
    saveProfiles(); renderProfileBtn();
    if(r.settings && typeof r.settings==='object' && r.settings.setupDone) r={...r, settings:{...r.settings, upd:Math.max(+r.settings.upd||0, +DB.settings.upd||0)+1}}; }
  return merge(r, true);
}
function syncLabel(txt, busy){ const b=$('#syncBtn'), l=$('#syncLbl'); if(!b||!l) return; b.classList.toggle('busy',!!busy); l.textContent=txt; clearTimeout(lblTimer); if(!busy && txt!=='Sync') lblTimer=setTimeout(()=>renderSyncDot(),2500); }
function showLast(){ const el=$('#cLast'); if(el) el.textContent=DB.meta.lastCloud? new Date(DB.meta.lastCloud).toLocaleString('en-SG') : 'not yet'; }
async function cloudSync(manual, poll){
  if(!cloudOn()){ if(manual){ toast('Sign in with Google to sync'); go('settings'); } return false; }
  if(!gTokenOk()){ cloudState='expired'; renderSyncDot(); renderCloudStatus(); if(manual) gRedirect({}); return false; }
  if(cloudBusy){ if(manual){ cloudManualWait=true; syncLabel('Syncing…',true); } else if(!poll) cloudAgain=true; return false; }
  cloudBusy=true; cloudAgain=false; if(manual) syncLabel('Syncing…',true);
  const dirty=cloudDirty||manual; cloudDirty=false; let n=0;
  try{
    let id=await gFindFile(), m=null;
    if(id){ try{ m=await gMeta(id); }catch(e){ if(e.status===404){ gSave({...gCfg(), fileId:null}); id=null; } else throw e; } }
    if(!id){ const j=await gCreate(JSON.stringify(exportObj())); gVer=j.version||null; }
    else{
      if(m.version!==gVer){ n+=adoptAndMerge(await gDownload(id)); gVer=m.version; }
      if(dirty || gFirst){ const m2=await gMeta(id); if(m2.version!==gVer){ n+=adoptAndMerge(await gDownload(id)); }
        const u=await gUpload(id, JSON.stringify(exportObj())); gVer=u.version||null; }
    }
    gFirst=false; const was=cloudState; cloudState='ok'; DB.meta.lastCloud=Date.now(); persist();
    if(n){ try{ cleanupFunds(); ensureOpening(); }catch(e){} render(); maybeWizard(); }
    else if(was!=='ok'){ renderSyncDot(); if(S.tab==='settings') renderCloudStatus(); } else { renderSyncDot(); showLast(); }
    if(manual){ syncLabel('Synced ✓'); toast(n? `Synced · ${n} update${n===1?'':'s'} from your other devices` : 'Synced — everything is up to date'); }
    else if(n && !poll) toast(`Updated · ${n} change${n===1?'':'s'} from Google Drive`);
    else if(n) toast(`Updated · ${n} change${n===1?'':'s'} from your other device`);
    return true;
  }catch(e){ if(dirty) cloudDirty=true;
    if(e.expired) cloudState='expired'; else { cloudErr = e.name==='AbortError'? 'no response' : (e.message||String(e)); cloudState='err'; }
    renderSyncDot(); renderCloudStatus();
    if(manual){ syncLabel('Sync'); if(e.expired) gRedirect({}); else toast('Sync failed ('+(e.name==='AbortError'?'no response, check internet':cloudErr)+'). It will retry automatically.'); }
    return false; }
  finally{ cloudBusy=false;
    if(cloudManualWait){ cloudManualWait=false; setTimeout(()=>cloudSync(true),50); }
    else if(cloudAgain){ cloudAgain=false; setTimeout(()=>cloudSync(false),200); } }
}
function scheduleCloud(){ if(!cloudOn()) return; cloudDirty=true; if(!gTokenOk()){ cloudState='expired'; renderSyncDot(); return; } clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>cloudSync(false),800); }
function scheduleSync(){ scheduleCloud(); renderSyncDot(); }
setInterval(()=>{ if(cloudOn() && gTokenOk() && document.visibilityState==='visible') cloudSync(false,true); }, 10000);
window.addEventListener('online',()=>{ if(cloudOn() && gTokenOk()) cloudSync(false); });
/* After start-up: use a fresh token, or refresh an expired one by visiting Google and coming straight back (at most every 10 minutes) */
function gStartup(res){
  if(res && res.bad) setTimeout(()=>toast('That sign-in link was ignored. Sign in from Settings → Sync.'),600);
  if(res && res.error){ if(res.silent){ cloudState='expired'; } else setTimeout(()=>toast(res.error==='access_denied'? 'Sign-in cancelled' : res.error==='no_drive'? 'Pocket Budget needs the Google Drive permission to save your data' : 'Google sign-in didn’t work ('+res.error+')'),600); }
  if(!cloudOn()){ renderSyncDot(); return; }
  if(gTokenOk()){ initSync(); if(res && res.ok){ if(!gCfg().email) gWho(); if(res.first) setTimeout(()=>toast('Signed in. Your data now saves to your Google Drive.'),900); } return; }
  let last=0; try{ last=+localStorage.getItem(GSILENT)||0; }catch(e){}
  if(GOOGLE_CLIENT_ID && navigator.onLine && Date.now()-last>10*60000 && !(res && res.error) && !document.body.classList.contains('locked')){ try{ localStorage.setItem(GSILENT, String(Date.now())); }catch(e){} gRedirect({silent:true}); return; }
  cloudState='expired'; renderSyncDot();
}
async function gSignOut(alsoDelete){
  const c=gCfg();
  if(alsoDelete){ try{ const id=await gFindFile(); if(id) await gFetch(`${G_API}/files/${encodeURIComponent(id)}`,{method:'DELETE'}); }catch(e){ if(!e.expired){ toast('Couldn’t delete it from Drive ('+(e.message||e)+')'); return; } toast('Sign in again first, then delete'); gRedirect({}); return; } }
  if(c && c.token){ try{ fetch('https://oauth2.googleapis.com/revoke',{method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'token='+encodeURIComponent(c.token)}).catch(()=>{}); }catch(e){} }
  gClear(); cloudState='off'; gVer=null; render(); toast(alsoDelete? 'Deleted from your Google Drive and signed out. Your data is still on this device.' : 'Signed out. Your data stays on this device.');
}
const gButton = (id, label) => `<button class="gbtn" id="${id}"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg><span>${label}</span></button>`;
function renderSyncDot(){
  const d=$('#syncDot'), l=$('#syncLbl'), b=$('#syncBtn'); if(!d||!b) return; if(b.classList.contains('busy')) return;
  if(!cloudOn()){ d.className='syncdot'; if(l) l.textContent='Sync'; b.title='Sign in with Google to back up and sync'; return; }
  const st = !gTokenOk()? 'expired' : cloudState;
  d.className='syncdot '+(st==='ok'?'ok':st==='err'||st==='expired'?'need':'');
  if(l) l.textContent = st==='expired'? 'Sign in' : 'Sync';
  b.title = st==='expired'? 'Google sign-in expired · tap to sign in again' : st==='ok'? 'Synced with Google Drive · '+(DB.meta.lastCloud?new Date(DB.meta.lastCloud).toLocaleString():'') : 'Google Drive sync';
}
function renderCloudStatus(){
  const box=$('#cloudBox'); if(!box) return;
  if(!GOOGLE_CLIENT_ID){ box.innerHTML=`<div class="small muted">Google sign-in isn’t switched on in this copy of the app yet. Your data is saved on this device; use “Save a backup file” below to keep a copy.</div>`; return; }
  const c=gCfg();
  if(!c){
    box.innerHTML = `<div class="small" style="margin-bottom:10px">Sign in to back up your data and use the app on more than one phone or computer.</div>
      ${gButton('cGoogle','Sign in with Google')}
      <div class="small muted" style="margin-top:10px">Your data goes to a hidden app folder in <b>your own</b> Google Drive. Only this app can open it: not other people, and not the person who made the app. It doesn’t count your other Drive files and can’t see them.</div>`;
    $('#cGoogle').onclick=()=>gRedirect({});
    return;
  }
  const last = DB.meta.lastCloud? new Date(DB.meta.lastCloud).toLocaleString('en-SG') : 'not yet', exp=!gTokenOk();
  box.innerHTML = `<div class="small" style="margin-bottom:10px"><span class="syncdot ${exp||cloudState==='err'?'need':'ok'}"></span>${exp? 'Signed in as <b>'+esc(c.email||'your Google account')+'</b>, but Google needs you to sign in again (it does this every hour or so).' : cloudState==='err'? 'Couldn’t reach Google Drive ('+esc(cloudErr||'offline?')+'). It keeps retrying.' : 'Syncing with <b>'+esc(c.email||'your Google Drive')+'</b>'} · last synced <span id="cLast">${last}</span></div>
    <div class="btns">${exp? gButton('cAgain','Sign in again') : '<button class="btn primary" id="cSync">Sync now</button>'}<button class="btn" id="cOff">Sign out</button></div>
    <details style="margin-top:10px"><summary class="small muted">More</summary><div class="small muted" style="margin:6px 0 8px">Saves automatically after each change and checks for changes from your other devices every few seconds while the app is open.</div><button class="btn danger sm" id="cDel">Delete my data from Google Drive</button></details>`;
  if($('#cSync')) $('#cSync').onclick=()=>cloudSync(true);
  if($('#cAgain')) $('#cAgain').onclick=()=>gRedirect({});
  confirmBtn($('#cOff'),'Tap again to sign out',()=>gSignOut(false));
  confirmBtn($('#cDel'),'Tap again: delete from Drive',()=>gSignOut(true));
}
$('#syncBtn').onclick=()=>{ if(!cloudOn()) go('settings'); else if(!gTokenOk()) gRedirect({}); else cloudSync(true); };
$('#fileIn').onchange=async ev=>{
  const f=ev.target.files[0]; ev.target.value=''; if(!f) return;
  try{ const n=merge(JSON.parse(await f.text())); DB.meta.lastManual=Date.now(); save(); toast(`Merged · ${n} update${n===1?'':'s'}`); render(); maybeWizard(); }
  catch(e){ toast('Could not read file: '+e.message); }
};
async function exportSyncFile(){
  const blob = new Blob([JSON.stringify(exportObj())],{type:'application/json'});
  const file = new File([blob],syncFileName(),{type:'application/json'});
  DB.meta.lastManual=Date.now(); persist();
  if(navigator.canShare && navigator.canShare({files:[file]}) && matchMedia('(pointer:coarse)').matches){
    try{ await navigator.share({files:[file], title:syncFileName()}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  download(blob,syncFileName());
}
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
function exportCSV(ym){
  const es = Object.values(DB.entries).filter(e=>!e.del && (!ym||e.date.startsWith(ym))).sort((a,b)=>a.date.localeCompare(b.date));
  const q=v=>{ v=String(v??''); if(/^[=+\-@\t\r]/.test(v) && !/^-?\d/.test(v)) v="'"+v;   // stop spreadsheet formulas in notes
    return /[",\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; };
  const rows=[['Date','Category','Type','Amount '+curCode(),'Amount sent home','Home currency','Rate','Note','Paid with / account']].concat(es.map(e=>[e.date,e.cat==='refund'?'Refund':(CAT[e.cat]?.name||e.cat),subOf(e)?.name||'',(CAT[e.cat]?.income?-e.amt:e.amt).toFixed(2),isSendCat(e.cat)?(e.inr||''):'',isSendCat(e.cat)?(e.homeCur||''):'',isSendCat(e.cat)?(e.rate||''):'',e.note||'',e.cat==='xfer'?(fundName(e.from)||'Outside')+' → '+fundName(e.to):fundName(e.pay)]));
  download(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}), `pocket-budget-${slug(curProfile().name)}-${ym||'all'}.csv`);
}

/* ============ Profiles ============ */
const AV_COLORS = ['#2a78d6','#1baf7a','#eb6834','#4a3aa7','#e34948','#008300','#c98500','#d55181'];
const avatar = (p,lg) => `<span class="av${lg?' lg':''}" style="background:${AV_COLORS[(p.color||0)%AV_COLORS.length]}">${esc((p.name||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;
async function hashPin(pin, salt){
  const data = new TextEncoder().encode(salt+':'+pin);
  try{ const d = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let h=0; for(const c of data) h=(h*31+c)>>>0; return 'x'+h.toString(16); }
}
function curOptions(sel){ return Object.entries(CURRENCIES).map(([c,i])=>`<option value="${c}" ${c===sel?'selected':''}>${c} — ${i.name}</option>`).join(''); }
function renderProfileBtn(){ const p=curProfile(); $('#profBtn').innerHTML = `${avatar(p)}<span class="nm">${esc(p.name)}</span><span class="muted" style="font-size:11px">▾</span>`; }

function profileSheet(){
  const h = `<div class="row" style="justify-content:space-between"><h3>Profiles</h3><button class="btn sm" onclick="dismissSheet()">Close</button></div>
    <div class="small muted" style="margin-bottom:8px">Each person gets their own expenses, budgets, categories and Google sign-in on this device.</div>
    <div>${PROFILES.list.map(p=>`<div class="prow" data-pid="${p.id}">${avatar(p,true)}<div class="grow"><b>${esc(p.name)}</b><span class="small muted">${p.id===PROFILES.current?'Using now':'Tap to switch'} · ${p.currency||'SGD'}${p.pin?' · 🔒 PIN':''}</span></div>
      <button class="btn sm" data-pedit="${p.id}">Edit</button></div>`).join('')}</div>
    <div class="btns" style="margin-top:12px"><button class="btn primary" id="pAdd">+ Add profile</button></div>`;

function editProfile(id){
  const p = id ? PROFILES.list.find(x=>x.id===id) : null;
  const h = `<div class="row" style="justify-content:space-between"><h3>${p?'Edit profile':'New profile'}</h3><button class="btn sm" id="pBack">Back</button></div>
    <label class="f" for="pName">Name</label><input class="in" id="pName" maxlength="24" value="${p?esc(p.name):''}" placeholder="e.g. Priya">
    <label class="f" for="pPin">${p&&p.pin?'New 4-digit PIN (leave empty to keep the current PIN)':'4-digit PIN (optional)'}</label>
    <input class="in num" id="pPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="••••" autocomplete="new-password">
    <div class="small muted" style="margin-top:6px">A PIN stops others opening this profile in the app. It doesn't encrypt the data on the device.</div>
    <div class="grid2">
      <div><label class="f" for="pCur">Expense currency</label><select class="in" id="pCur">${curOptions(p?.currency||(p?'SGD':curCode()))}</select></div>
      <div><label class="f" for="pHome">Home currency (optional)</label><select class="in" id="pHome"><option value="">None</option>${curOptions(p? (p.homeCur||'') : '')}</select></div>
    </div>
    <div class="small muted" style="margin-top:6px">If you send money home, pick that currency: categories marked “money sent home” also save the amount in it, with that day's exchange rate.</div>
    ${p&&Object.keys(p.id===PROFILES.current?DB.entries:{}).length?'<div class="small muted" style="margin-top:6px">Changing the currency doesn’t convert amounts you’ve already entered.</div>':''}
    <div class="btns" style="margin-top:14px"><button class="btn primary" id="pSave">${p?'Save':'Create profile'}</button>
      ${p&&p.pin?'<button class="btn" id="pNoPin">Remove PIN</button>':''}
      ${p&&PROFILES.list.length>1?`<button class="btn danger" id="pDel">Delete profile</button>`:''}</div>`;
  openSheet(h);
  $('#pBack').onclick=profileSheet;
  if(!p) setTimeout(()=>$('#pName').focus(),50);
  $('#pSave').onclick=async()=>{
    const name=$('#pName').value.trim(), pin=$('#pPin').value.trim();
    if(!name){ toast('Enter a name'); $('#pName').focus(); return; }
    if(PROFILES.list.some(x=>x.id!==id && x.name.toLowerCase()===name.toLowerCase())){ toast('Another profile already has that name'); return; }
    if(pin && !/^\d{4}$/.test(pin)){ toast('The PIN must be 4 digits'); $('#pPin').focus(); return; }
    const cur=$('#pCur').value, home=$('#pHome').value;
    let target = p;
    if(!target){ target={id:'p'+uid(), name, color:PROFILES.list.length}; PROFILES.list.push(target); }
    target.name=name; target.currency=cur; if(home && home!==cur) target.homeCur=home; else delete target.homeCur;
    if(pin){ target.salt=uid(); target.pin=await hashPin(pin,target.salt); }
    saveProfiles(); renderProfileBtn();
    if(!p){ toast(`Profile "${name}" created`); switchProfile(target.id, true); }
    else { toast('Profile saved'); profileSheet(); if(id===PROFILES.current) render(); }
  };
  if($('#pNoPin')) $('#pNoPin').onclick=()=>{ delete p.pin; delete p.salt; saveProfiles(); toast('PIN removed'); profileSheet(); };
  if($('#pDel')) confirmBtn($('#pDel'),`Tap again to delete ${p.name} and all their data here`,async()=>{
    try{ localStorage.removeItem(keyFor(p.id)); localStorage.removeItem(gKey(p.id)); }catch(e){}
    await idb.del(syncKeyFor(p.id));
    PROFILES.list = PROFILES.list.filter(x=>x.id!==p.id);
    const wasCurrent = PROFILES.current===p.id;
    saveProfiles(); toast(`Deleted ${p.name}`);
    if(wasCurrent) switchProfile(PROFILES.list[0].id, true); else profileSheet();
  });
}
async function switchProfile(id, skipPin){
  const p = PROFILES.list.find(x=>x.id===id); if(!p) return;
  if(id===PROFILES.current && !skipPin){
    if(document.body.classList.contains('locked') && p.pin){ if(await askPin(p)){ document.body.classList.remove('locked'); dismissSheet(); } return; }
    dismissSheet(); return; }
  if(p.pin && !skipPin){ const ok = await askPin(p); if(!ok) return; }
  clearTimeout(syncTimer);
  document.body.classList.remove('locked');
  PROFILES.current = id; saveProfiles();
  KEY = keyFor(id); DB = loadDB(); buildCats(); applyTheme(); closeWizard();
  SH = null; syncState='none';
  Object.assign(S, {ym:curYM(), tab:'home', histCat:'all', selDay:null, lastCat:null});
  dismissSheet(); renderProfileBtn(); render(); window.scrollTo(0,0);
  toast(`Switched to ${p.name}`);
  initSync(); maybeWizard();
}
/* Full-screen PIN pad. Resolves true when the right PIN is entered, false if cancelled. */
function askPin(p, blocking){
  return new Promise(resolve=>{
    const el = document.createElement('div'); el.className='lock';
    let val='';
    const draw = (msg)=>{ el.innerHTML = `<div class="box">${avatar(p,true).replace('class="av lg"','class="av lg" style="margin:0 auto;width:56px;height:56px;font-size:24px;background:'+AV_COLORS[(p.color||0)%AV_COLORS.length]+'"')}
      <h3 style="margin:12px 0 2px">${esc(p.name)}</h3><div class="small ${msg?'neg':'muted'}">${msg||'Enter PIN'}</div>
      <div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<val.length?'on':''}"></i>`).join('')}</div>
      <div class="pinpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" style="font-size:14px">${blocking?(PROFILES.list.length>1?'Switch':''):'Cancel'}</button><button data-k="0">0</button><button data-k="b" aria-label="Delete">⌫</button></div></div>`;
      el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k)); };
    const finish = ok => { document.removeEventListener('keydown', kd); el.remove(); resolve(ok); };
    const key = async k => {
      if(k==='x'){ if(!blocking) finish(false); else if(PROFILES.list.length>1){ finish(false); } return; }
      if(k==='b'){ val=val.slice(0,-1); draw(); return; }
      if(val.length>=4) return;
      val+=k; draw();
      if(val.length===4){ const h = await hashPin(val,p.salt); if(h===p.pin) finish(true); else { val=''; draw('Wrong PIN — try again'); } }
    };
    const kd = ev => { if(/^\d$/.test(ev.key)) key(ev.key); else if(ev.key==='Backspace') key('b'); else if(ev.key==='Escape' && !blocking) key('x'); };
    document.addEventListener('keydown', kd);
    draw(); document.body.appendChild(el);
  });
}
/* On start: if the current profile has a PIN, lock until it's entered (or the person switches). */
async function startupLock(){
  const p = curProfile(); if(!p.pin) return true;
  document.body.classList.add('locked');
  const ok = await askPin(p, true);
  if(ok){ document.body.classList.remove('locked'); return true; }
  profileSheet(); return false;
}

/* ============ Two-tap confirm (no browser dialogs) ============ */
function confirmBtn(btn,msg,fn){
  const orig=btn.textContent;
  btn.onclick=()=>{
    if(btn.dataset.armed){ fn(); return; }
    btn.dataset.armed='1'; btn.textContent=msg; btn.classList.add('primary');
    setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=orig; btn.classList.remove('primary'); } },4000);
  };
}

/* ============ Sample data (for trying the app) ============ */
function hasSample(){ return Object.values(DB.entries).some(e=>e.sample&&!e.del) || Object.values(DB.months).some(m=>m.sample); }
function loadSample(){
  const ym=curYM(), pm=addMonths(ym,-1), today=new Date().getDate(), now=Date.now();
  let seed=7; const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const add=(date,cat,amt,extra={})=>{ const k=CAT[cat]; if(!k || k.hidden) return; if(extra.sub && !(k.subs||[]).some(t=>t.id===extra.sub)) delete extra.sub; if(k.subs && k.subs.length && !extra.sub) extra.sub=k.subs[0].id; const id='sample-'+uid(); DB.entries[id]={id,date,cat,amt:r2(amt),upd:now,cr:now,sample:true,...extra}; };
  const month=(m,days)=>{
    for(let i=1;i<=days;i++){ const d=m+'-'+pad(i);
      add(d,'food',3+rnd()*2.5,{sub:'breakfast',note:'Coffee & toast'});
      add(d,'food',6+rnd()*5,{sub:'lunch',note:'Canteen'});
      add(d,'food',7+rnd()*9,{sub:'dinner'});
      if(rnd()>.45) add(d,'food',2.2+rnd()*5,{sub:'coffee'});
      if(rnd()>.35) add(d,'travel',1.8+rnd()*6,{note:'Bus / train'});
      if(i%7===6) add(d,'food',28+rnd()*20,{sub:'groceries',note:'Supermarket'});
      if(rnd()>.8) add(d,'food',14+rnd()*12,{sub:'delivery',note:'Food delivery'});
    }
    add(m+'-01','rent',900,{note:'Room rent'});
    if(days>=5) add(m+'-05','phone',25,{note:'Mobile plan'});
    
    if(days>=8) add(m+'-08','personal',18,{note:'Haircut'});
    if(days>=10) add(m+'-10','bills',58.6,{note:'Electricity'});
    if(days>=17) add(m+'-17','misc',12,{note:'Gift wrap'});
    if(days>=12) add(m+'-12','entertainment',15.5,{note:'Movie'});
    if(days>=14) add(m+'-14','medical',68,{note:'GP visit'});
    if(days>=19) add(m+'-19','shopping',46.9,{note:'Clothes'});
    if(days>=22) add(m+'-22','refund',40,{note:'Insurance claim'});
  };
  month(pm,dim(pm)); month(ym,today);
  const b={bills:70,misc:40,food:750,travel:120,phone:30,entertainment:60,medical:80,personal:40,shopping:150,rent:900};
  if(!DB.months[pm]) DB.months[pm]={salary:3500,budgets:Object.fromEntries(Object.entries(b).filter(([k])=>CAT[k])),upd:now,sample:true};
  save(); toast('Sample data loaded — remove it in Settings'); render();
}
function removeSample(){
  const now=Date.now();
  for(const e of Object.values(DB.entries)) if(e.sample && !e.del){ e.del=true; e.upd=now; }
  for(const [k,m] of Object.entries(DB.months)) if(m.sample) DB.months[k]={salary:0,budgets:{},upd:now,del:true};
  save();
}

const TABKEY='pocketBudget.tab';
function go(t){ S.tab=t; try{ localStorage.setItem(TABKEY,t); }catch(e){} window.scrollTo(0,0); render(); }
/* After a refresh, reopen the page you were on (Analysis, Calendar, …) instead of Home. */

/* Back button: closes an open sheet; from Calendar/Analysis/Budget/Settings goes to Home, and the next back closes the app.
   On Home after using it, back once shows "Press back again to close". The guard history entry is re-added on taps,
   because Chrome skips history entries that no tap followed. */
(function(){ if(!(history.pushState && window.matchMedia)) return; let exitT=0;
  const guard=()=>{ try{ if(!(history.state&&history.state.g)) history.pushState({g:1},''); }catch(e){} };
  guard(); ['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>guard(),{capture:true,passive:true}));
  window.addEventListener('popstate',()=>{
    if($('#sheetBg').classList.contains('open')){ closeSheet(); guard(); return; }
    if(S.tab!=='home'){ go('home'); return; }
    if(Date.now()-exitT<2000) return;
    exitT=Date.now(); toast('Press back again to close');
    setTimeout(()=>{ if(Date.now()-exitT>=1900) guard(); },2000);
  });
})();
gStartup(G_RET);
startupLock();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  const hadSW = !!navigator.serviceWorker.controller; let reloaded=false;
  navigator.serviceWorker.register('sw.js').then(r=>{ try{ r.update().catch(()=>{}); }catch(e){} }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(hadSW && !reloaded){ reloaded=true; location.reload(); } });
}
