<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket Budget</title>
<meta name="description" content="Pocket Budget: track daily spending, budgets and savings. Your data stays on your phone and your own Google Drive.">
<meta name="theme-color" content="#0f7f68">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://api.frankfurter.dev https://api.frankfurter.app https://open.er-api.com; object-src 'none'; base-uri 'self'; form-action 'none'; manifest-src 'self'; worker-src 'self'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eff2f6; --border:#e3e7ed;
  --text:#0e1726; --text-2:#475467; --muted:#8a94a6; --card-border:transparent;
  --hero-1:#11977a; --hero-2:#0a5c4c;
  --accent:#0f7f68; --accent-ink:#ffffff;
  --series-1:#2a78d6; --series-3:#1baf7a;
  --g1:#2a78d6; --g2:#eb6834; --g3:#4a3aa7; --g4:#eda100; --g5:#e87ba4; --g6:#008300; --g7:#e34948; --g8:#8e3b8e; --g9:#7a8a00;
  --good:#008300; --warn:#b77a00; --bad:#d03b3b;
  --good-bg:#e3f3e3; --warn-bg:#fbf0d6; --bad-bg:#fbe3e3;
  --grid:#e6e4de;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
    --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
    --hero-1:#12866c; --hero-2:#0a4a3e;
    --accent:#17977a; --accent-ink:#ffffff;
    --series-1:#3987e5; --series-3:#199e70;
    --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
    --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
    --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
    --grid:#2c2c29;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d0f13; --surface:#171a20; --surface-2:#22262e; --border:#2c313a;
  --text:#f5f7fa; --text-2:#b8c0cc; --muted:#8792a2; --card-border:#262a32;
  --hero-1:#12866c; --hero-2:#0a4a3e;
  --accent:#17977a; --accent-ink:#ffffff;
  --series-1:#3987e5; --series-3:#199e70;
  --g1:#3987e5; --g2:#d95926; --g3:#9085e9; --g4:#c98500; --g5:#d55181; --g6:#008300; --g7:#e66767; --g8:#b565b5; --g9:#8f9f1a;
  --good:#4fb84f; --warn:#e0a526; --bad:#ef6b6b;
  --good-bg:#1d3320; --warn-bg:#3a2f14; --bad-bg:#3d1f1f;
  --grid:#2c2c29;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header.top h1{font-size:17px;margin:0;font-weight:650}
.profbtn{display:flex;align-items:center;gap:7px;border:0;background:transparent;cursor:pointer;padding:4px 8px 4px 4px;border-radius:20px;font-weight:650;font-size:15px;color:var(--text);min-width:0;max-width:40vw}
.profbtn:hover{background:var(--surface-2)}
.profbtn .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.av.lg{width:40px;height:40px;font-size:17px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--border);cursor:pointer;border-radius:8px}
.prow:first-child{border-top:0}
.prow:hover{background:var(--surface-2)}
.prow .grow{flex:1;min-width:0}
.prow .grow b{display:block}
.pinpad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.pinpad button{height:56px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:600;cursor:pointer}
.pinpad button:active{background:var(--surface-2)}
.pindots{display:flex;gap:12px;justify-content:center;margin:10px 0}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.pindots i.on{background:var(--text)}
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.lock .box{width:100%;max-width:340px;text-align:center}
body.locked main,body.locked nav.tabs,body.locked .fab,body.locked .fabcalc,body.locked .monthnav,body.locked #syncBtn{visibility:hidden}
body.locked::after{content:"Locked. Tap the name at the top to unlock or switch profile.";position:fixed;left:16px;right:16px;top:40%;text-align:center;color:var(--text-2)}
.monthnav{display:flex;align-items:center;gap:2px}
.monthnav button{border:0;background:transparent;width:34px;height:34px;border-radius:8px;font-size:20px;cursor:pointer;color:var(--text-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .mlabel{width:auto;min-width:104px;padding:0 10px;font-size:15px;font-weight:650;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.monthnav .mlabel svg{width:15px;height:15px;color:var(--accent)}
.sheet .monthnav .mlabel{cursor:default}
main{max-width:760px;margin:0 auto;padding:12px 16px 84px}
.card{background:var(--surface);border:1px solid var(--card-border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 12px;color:var(--text);font-weight:700;letter-spacing:-.01em}
.card h2 .lnk,.sechead .lnk{float:right;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:0;padding:0}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface-2);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--text-2)}
.kpi .v{font-size:19px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.cat{padding:10px 0;border-top:1px solid var(--border)}
.cat:first-of-type{border-top:0}
.cat .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px;flex:none}
.cat .nm{font-weight:600}
.cat .meta{font-size:12px;color:var(--text-2)}
.cat .amt{margin-left:auto;text-align:right;white-space:nowrap}
.cat .amt b{font-weight:650}
.bar{height:6px;border-radius:4px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--good)}
.bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.subgrp{margin:10px 0 0 44px;display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--text-2);flex-wrap:wrap}
.subs{margin:6px 0 0 44px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:560px){.subs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sub{background:var(--surface-2);border-radius:8px;padding:6px 8px;font-size:12px}
.sub b{display:block;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:6px 0;border-radius:10px;font-size:11px;color:var(--text-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;max-width:120px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);font-weight:700}
nav.tabs button.on svg{background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:12px;padding:3px 12px;width:46px;height:28px;box-sizing:border-box;margin-top:-3px}
.fab{position:fixed;right:18px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(42,120,214,.4)}
@media (min-width:800px){.fab{right:calc(50% - 370px)}.fabcalc{right:calc(50% - 300px)}}
.fabcalc{position:fixed;right:88px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:31;width:46px;height:46px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px;line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.calcpad{margin:10px 0 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:18px;padding:12px}
.calcpad .expr{font-size:16px;color:var(--text-2);text-align:right;min-height:22px;word-break:break-all}
.calcpad .res{font-size:32px;font-weight:800;text-align:right;margin:2px 0 10px;min-height:40px}
.calcpad .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.calcpad .keys button{height:52px;border-radius:12px;border:0;background:var(--surface);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit}
.calcpad .keys button:active{transform:scale(.96)}
.calcpad .keys .op{background:rgba(42,120,214,.18);color:var(--accent)}
.calcpad .keys .eq{background:var(--accent);color:#fff}
.calcpad .keys .c{color:var(--bad)}
.btn{border:1px solid var(--border);background:var(--surface);padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px;font-weight:600}
input.in,select.in,textarea.in{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;background:var(--surface);outline:none}
input.in:focus,select.in:focus{border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--border);background:var(--surface);padding:7px 10px;border-radius:999px;cursor:pointer;font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--border);margin:0 auto 10px}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 6px;font-size:18px}
.bigamt{font-size:26px;font-weight:650;text-align:right}
.day{margin-bottom:12px}
.day .dh{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);font-weight:600;padding:0 4px 6px}
.eye{border:0;background:var(--surface-2);color:var(--text-2);border-radius:10px;width:36px;height:36px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.eye svg{width:20px;height:20px}
.ent{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--border);cursor:pointer}
.ent:first-child{border-top:0}
.ent:hover{background:var(--surface-2)}
.ent .ic{font-size:18px;width:26px;text-align:center}
.ent .t{flex:1;min-width:0}
.ent .t div:last-child{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{color:var(--text-2);font-weight:600;font-size:12px}
.tablewrap{overflow-x:auto}
.hbar{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.hbar .track{height:14px;position:relative}
.hbar .track i{position:absolute;left:0;top:0;bottom:0;background:var(--series-1);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .track i{filter:brightness(1.1)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:6px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--muted);font-size:11px}
.msum{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.msum svg{width:170px;height:170px;flex:none;margin:0 auto}
.msum svg .c1{fill:var(--text);font-size:16px;font-weight:700}
.msum svg .c2{fill:var(--muted);font-size:11px}
.plist{flex:1;min-width:200px;display:grid;gap:6px}
.plist div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center;font-size:13px}
.plist i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.plist .num{text-align:right}.plist .pc{color:var(--muted);min-width:34px;text-align:right}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;max-width:220px}
#tip.on{opacity:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.syncdot.ok{background:var(--good)} .syncdot.need{background:var(--warn)}
#syncBtn.busy .syncdot{background:var(--accent);animation:sdp .7s ease-in-out infinite alternate}
@keyframes sdp{from{transform:scale(.6);opacity:.5}to{transform:scale(1.25);opacity:1}}
.insight{padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.insight:first-of-type{border-top:0}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1.05;border-radius:8px;background:var(--surface-2);padding:4px 5px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:2px solid transparent;min-width:0;overflow:hidden;color:var(--text)}
.cal .d:hover{border-color:var(--border)}
.cal .d.today{border-color:var(--text-2)}
.cal .d.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cal .d.future{opacity:.45}
.cal .dn{font-size:11px;font-weight:600;opacity:.8}
.cal .da{font-size:12px;font-weight:650;text-align:right;white-space:nowrap}
@media (min-width:560px){.cal{gap:6px}.cal .d{aspect-ratio:1.25/1;padding:6px 8px}.cal .dn{font-size:12px}.cal .da{font-size:14px}}
.calleg{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-2);margin-top:10px}
.calleg i{display:block;width:90px;height:8px;border-radius:4px}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.brow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.brow .ic.sm{width:28px;height:28px;font-size:15px;justify-self:end}
.brow .nm{font-weight:600}
.brow .meta{font-size:12px;color:var(--text-2)}
.brow .bin{text-align:right}
.brow .bin[readonly]{background:var(--surface-2);color:var(--text-2)}
.frow{display:grid;grid-template-columns:34px minmax(0,1fr) 116px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.frow .ic{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:18px}
.frow .nm{font-weight:600}
.frow label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-2);margin-top:4px;cursor:pointer}
.frow input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.share{height:4px;border-radius:3px;background:var(--surface-2);margin-top:6px;overflow:hidden}
.share i{display:block;height:100%;background:var(--series-1);border-radius:3px}
.bparts{margin-left:20px;padding-left:12px;border-left:2px solid var(--border);margin-bottom:6px}
.brow.part{border-top:1px dashed var(--border);padding:8px 0;grid-template-columns:28px minmax(0,1fr) 116px}
.hidden{display:none!important}
.stl{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:14px}
.stl.sub{padding:2px 0 2px 14px;font-size:12.5px;color:var(--text-2)}
.stl.tot{border-top:1.5px solid var(--text);margin-top:6px;padding-top:9px;font-weight:800;font-size:15px}
.stl.muted{color:var(--text-2)}
.stdiff{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700;font-size:14px;background:var(--surface-2)}
.stdiff.ok{background:var(--good-bg);color:var(--good)} .stdiff.bad{background:var(--warn-bg);color:var(--warn)}
.efrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.efrow .nm{font-weight:600}
.bgr{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--border)}
.card h2 + .bgr{border-top:0}
.bgr .nm{font-weight:600} .bgr .meta{font-size:12px;color:var(--text-2)} .bgr .bar{margin-top:6px}
.bgr .bin{text-align:right}

<script>
"use strict";
/* ============ Constants ============ */
/* Categories are the user's own (Settings → Categories), stored in DB.settings.cats and synced.
   kind: 'living' = everyday spending (counts in the daily-living pace), 'bill' = monthly bill, 'oneoff' = one-off spending.
   subs = optional types inside a category (e.g. Breakfast / Lunch in Food); when a category has types, one must be picked.
   send = money sent home: also records the amount in the home currency. hidden = removed (old entries still show). */
const DEFAULT_CATS = [
  {id:'food', name:'Food', icon:'🍽️', kind:'living', subs:[
    {id:'breakfast', name:'Breakfast', icon:'🍳'}, {id:'lunch', name:'Lunch', icon:'🍛'}, {id:'dinner', name:'Dinner', icon:'🍲'},
    {id:'coffee', name:'Drinks & snacks', icon:'🥤'}, {id:'groceries', name:'Groceries', icon:'🥬'}, {id:'delivery', name:'Delivery', icon:'🛵'}]},
  {id:'travel', name:'Transport', icon:'🚌', kind:'living'},
  {id:'shopping', name:'Shopping', icon:'🛍️', kind:'living'},
  {id:'entertainment', name:'Entertainment', icon:'🎬', kind:'living'},
  {id:'medical', name:'Health', icon:'💊', kind:'living'},
  {id:'personal', name:'Personal care', icon:'💇', kind:'living'},
  {id:'rent', name:'Rent', icon:'🏠', kind:'bill'},
  {id:'bills', name:'Bills & utilities', icon:'💡', kind:'bill'},
  {id:'phone', name:'Phone & internet', icon:'📱', kind:'bill'},
  {id:'subs', name:'Subscriptions', icon:'📺', kind:'bill'},
  {id:'home', name:'Money sent home', icon:'💸', kind:'bill', send:true},
  {id:'misc', name:'Miscellaneous', icon:'🧾', kind:'oneoff', reason:true},
];
/* Suggestions offered in the setup wizard on top of the defaults (not ticked unless chosen) */
const EXTRA_CATS = [
  {id:'education', name:'Education', icon:'📚', kind:'living'}, {id:'gifts', name:'Gifts & donations', icon:'🎁', kind:'oneoff'},
  {id:'insurance', name:'Insurance', icon:'🛡️', kind:'bill'}, {id:'fuel', name:'Fuel & parking', icon:'⛽', kind:'living'},
  {id:'kids', name:'Kids', icon:'🧸', kind:'living'}, {id:'pets', name:'Pets', icon:'🐾', kind:'living'},
  {id:'temple', name:'Temple / worship', icon:'🛕', kind:'living'}, {id:'laundry', name:'Laundry', icon:'🧺', kind:'living'},
];
/* Built in and not editable: friends, transfers and refunds */
const SYS_CATS = [
  {id:'lent', name:'Lent to friends', icon:'🤝', friend:true, sys:true},
  {id:'repaid', name:'Paid back by friend', icon:'💵', income:true, friend:true, sys:true},
  {id:'borrowed', name:'Borrowed from friend', icon:'🙏', friend:true, owe:true, track:true, sys:true},   // just a reminder: not spending
  {id:'payback', name:'Paid back to friend', icon:'📤', friend:true, owe:true, sys:true},                 // counts as spending
  {id:'xfer', name:'Transfer / top-up', icon:'🔁', track:true, sys:true},   // moves money between accounts: never spending
  {id:'refund', name:'Refunds', icon:'↩️', income:true, reason:true, sys:true},   // standalone: not linked to any category
];
const SYS_IDS = new Set(SYS_CATS.map(c=>c.id));
const CAT_KINDS = {living:'Daily living', bill:'Monthly bill', oneoff:'One-off'};
let CATS=[], CAT={}, EXP_CATS=[], BUDGET_CATS=[], FIXED=new Set(), LIVING_EXCL=new Set();
const FIXED_TXT = 'bills &amp; one-offs';
function okCat(c){ return c && typeof c==='object' && typeof c.id==='string' && /^[a-z0-9_-]{1,40}$/.test(c.id) && !SYS_IDS.has(c.id) && typeof c.name==='string'; }
function userCats(){ const c=(typeof DB!=='undefined' && DB && DB.settings && Array.isArray(DB.settings.cats))? DB.settings.cats.filter(okCat) : null;
  return (c && c.length? c : DEFAULT_CATS).map(x=>({...x, kind: CAT_KINDS[x.kind]? x.kind : 'living', name:String(x.name).slice(0,40), icon:String(x.icon||'•').slice(0,8),
    subs: Array.isArray(x.subs) && x.subs.length? x.subs.filter(t=>t && typeof t.id==='string' && typeof t.name==='string').map(t=>({id:t.id, name:String(t.name).slice(0,30), icon:String(t.icon||'•').slice(0,8)})) : undefined})); }
/* Rebuilds the category lists. Called after loading data, syncing, switching profile and editing categories. */
function buildCats(){
  CATS = [...userCats(), ...SYS_CATS];
  CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
  EXP_CATS = CATS.filter(c=>!c.income && !c.track);                 // hidden categories still count, so old spending never disappears

/* ============ Credit accounts (PayLater, credit card) and EMI ============

const isEmi = e => !!(e && !e.del && e.emi && e.emi.n>1 && e.pay);

function dueDay(f){ return Math.min(28, Math.max(1, parseInt((f||{}).due)||1)); }

  const f=allFunds().find(x=>x.id===e.pay), dd=dueDay(f), start=(typeof e.emi.start==='string' && /^\d{4}-\d{2}$/.test(e.emi.start))? e.emi.start : addMonths(ymOf(e.date),1);

function calReminder(id){ const f=funds().find(x=>x.id===id); if(!f) return; const N=nextDue(f).replace(/-/g,''), [y,m,d]=nextDue(f).split('-').map(Number), nx=new Date(y,m-1,d+1);
  const end=nx.getFullYear()+pad(nx.getMonth()+1)+pad(nx.getDate()); let cnt=12; const ems=Object.values(DB.entries).filter(e=>isEmi(e)&&e.pay===id);

/* Home: payments due in the next 6 days, or overdue */
function upcomingCard(){ const t=todayStr(), rows=[];

/* Move savings into the emergency fund (a transfer, so nothing is counted twice) */
function moveSavings(amt, forYm){
  const ev=funds().filter(f=>isSpend(f)), efs=funds().filter(f=>isEF(f));
  const from=(ev.slice().sort((a,b)=>liveBal(b)-liveBal(a))[0]||{}).id||'';
  xferForm(null,null,null,{title:'Move to savings', from, to:(efs.find(f=>f.id==='dbs')||efs[0]||{}).id||'', amt:amt? r2(amt):'', note: forYm? 'Savings '+ymLabel(forYm) : 'Savings', savingsFor: forYm||undefined,
    onSaved: forYm? ()=>setMonthFlag(forYm,{savingsDone:true}) : null});
}
/* ============ Month records, statement and month-end prompt ============ */
function setMonthFlag(ym, obj){
  const c=cfg(ym), cur=DB.months[ym]&&!DB.months[ym].del? DB.months[ym] : {salary:+c.salary||0, budgets:{...(c.budgets||{})}, fundsIn:[], fundsAmt:{}};
  DB.months[ym]={...cur, ...obj, upd:Date.now()}; save();
}
/* Money in and out of your accounts in a month (transfers between your own accounts don't count) */
function flows(ym, lite){
  const st=stats(ym, lite); let borrowed=0;
  for(const e of Object.values(DB.entries)) if(!e.del && e.cat==='borrowed' && e.date.startsWith(ym)) borrowed+=e.amt;
  const salary=st.salary, refunds=st.refund, repaid=st.by.repaid||0, spending=r2(st.gross);
  return {st, salary, refunds, repaid, borrowed:r2(borrowed), spending, net:r2(salary+refunds+repaid+borrowed-spending)};
}
function actualTotal(){ return r2(funds().reduce((a,f)=>a+liveBal(f),0) + emiDeferred(curYM())); }
function anyBalanceSet(){ return funds().some(f=>f.at); }
/* Opening balance of a month: stored, or carried from last month's closing. The first time, it is worked out from today's balances. */
function openingOf(ym, depth=0){
  const m=DB.months[ym];
  if(m && !m.del && typeof m.opening==='number') return m.opening;
  if(depth<24){ const pm=addMonths(ym,-1), po=openingOf(pm, depth+1); if(po!==null) return r2(po+flows(pm,true).net); }
  return null;
}
function ensureOpening(){
  const ym=curYM(); if(!trackBal() || !anyBalanceSet()) return;
  if(openingOf(ym)!==null) return;
  setMonthFlag(ym,{opening: r2(actualTotal()-flows(ym,true).net), openingAuto:true, openingAt:Date.now()});
}
/* When an account is added or deleted, a worked-out (not typed) opening balance is worked out again */
function reOpening(){ const ym=curYM(), m=DB.months[ym]; if(m && m.openingAuto) setMonthFlag(ym,{opening: r2(actualTotal()-flows(ym,true).net), openingAt:Date.now()}); }
function statementData(ym){
  const fl=flows(ym), op=openingOf(ym), cur=ym===curYM();
  const expected = op===null? null : r2(op+fl.net);
  const actual = cur? actualTotal() : null;
  const m=DB.months[ym]||{}, since=m.openingAt||0;
  const noAcct = cur? Object.values(DB.entries).filter(e=>!e.del && e.date.startsWith(ym) && (e.cr||0)>since && !e.pay && e.cat!=='xfer' && (CAT[e.cat] && (!CAT[e.cat].track || e.cat==='borrowed'))).length : 0;
  const salaryIn = Object.values(DB.entries).some(e=>!e.del && e.cat==='xfer' && e.salaryFor===ym);
  return {...fl, opening:op, expected, actual, diff: actual!==null&&expected!==null? r2(actual-expected) : null, noAcct, needSalary: cur && fl.salary>0 && !salaryIn && !m.openingAuto && op!==null};
}
/* Without balance tracking: the month is just income − spending */
function simpleStatement(ym, compact){
  const fl=flows(ym, true), c=fl.st, ln=(l,v,cls='')=>`<div class="stl ${cls}"><span>${l}</span><span class="num">${v}</span></div>`;
  const groups=groupTotals(c).map(g=>g.id==='lent'? {...g, v:(c.by.lent||0)+(c.by.payback||0)} : g).filter(g=>g.v>0.004).sort((a,b)=>b.v-a.v);

    <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span>Money left this month</span><b class="num ${c.saved<0?'neg':'pos'}">${sgd(c.saved)}</b></div>
    <div class="small muted" style="margin-top:2px">${c.salary? 'Income + refunds + friends repaid − spending' : 'Set your monthly income on the Budget tab'}</div></div>`;
  return `<div class="card"><h2>Statement · ${ymLabel(ym)}</h2>`+ln('Income', sgd(fl.salary))+(fl.refunds? ln('+ Refunds', sgd(fl.refunds)):'')+(fl.repaid? ln('+ Friends paid back', sgd(fl.repaid)):'')+
    ln('− Spending', '('+sgd(fl.spending)+')')+groups.map(g=>ln(esc(g.icon)+' '+esc(g.name), sgd(g.v),'sub')).join('')+
    ln('Money left this month', sgd(c.saved),'tot')+`<div class="small muted" style="margin-top:8px">Want to check this against your bank? Turn on “Track account balances” in Settings.</div></div>`;
}
function statementCard(ym, compact){
  if(!trackBal()) return simpleStatement(ym, compact);
  const d=statementData(ym), c=d.st;
  if(d.opening===null) return `<div class="card"><h2>Monthly statement</h2><div class="small muted">Set your account balances (Home → Accounts) and the statement will balance your money every month.</div><div class="btns" style="margin-top:10px"><button class="btn primary" onclick="balancesSheet({})">Set balances</button></div></div>`;
  const ok = d.diff!==null && Math.abs(d.diff)<0.005;
  const diffBox = d.diff===null? '' : `<div class="stdiff ${ok?'ok':'bad'}"><span>Difference</span><span class="num">${ok? sgd(0)+' · Balanced' : (d.diff>0?'+':'−')+sgd(Math.abs(d.diff))}</span></div>`;
  if(compact) return `<div class="card" style="cursor:pointer" onclick="statementSheet('${ym}')"><h2>Monthly statement<button class="lnk">Open</button></h2>
    <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span>Money left this month</span><b class="num ${c.saved<0?'neg':'pos'}">${sgd(c.saved)}</b></div>
    <div class="small muted" style="margin-top:2px">Salary + refunds + friends repaid − spending</div>${d.needSalary? '<div class="stdiff"><span>Salary isn’t in an account yet</span><span class="lnk">Add ›</span></div>' : diffBox}</div>`;

  const groups=groupTotals(c).map(g=>g.id==='lent'? {...g, v:(c.by.lent||0)+(c.by.payback||0)} : g).filter(g=>g.v>0.004).sort((a,b)=>b.v-a.v);   // gross, so the lines add up to Spending
  let h=`<div class="card"><h2>Statement · ${ymLabel(ym)}</h2>`+
    ln(`Opening balance <span class="small muted">1 ${ymLabel(ym,true).split(' ')[0]}${(DB.months[ym]||{}).openingAuto?' · worked out from your balances':''}</span>`, sgd(d.opening))+
    ln('+ Salary', sgd(d.salary))+ (d.refunds? ln('+ Refunds', sgd(d.refunds)):'') + (d.repaid? ln('+ Friends paid back', sgd(d.repaid)):'') + (d.borrowed? ln('+ Borrowed from friends', sgd(d.borrowed)):'')+
    ln('− Spending', '('+sgd(d.spending)+')')+ groups.map(g=>ln(esc(g.icon)+' '+esc(g.name), sgd(g.v),'sub')).join('')+
    ln(ym===curYM()?'Expected balance':'Closing balance', sgd(d.expected),'tot');
  if(d.actual!==null) h+= ln('Your account balances', sgd(d.actual),'muted') + diffBox;
  if(d.diff!==null && !ok) h+=`<div class="small muted" style="margin-top:8px">${d.diff>0?'Your accounts hold more than expected':'Your accounts hold less than expected'}: a payment or income without an account (“Paid with” / “Received in”), or a balance that needs updating.${d.noAcct?` <b>${d.noAcct} entr${d.noAcct===1?'y':'ies'}</b> this month have no account.`:''}</div>`;
  if(d.needSalary) h+=`<div class="stdiff" style="margin-top:10px"><span>Salary isn’t in an account yet</span><button class="btn sm primary" onclick="salarySheet('${ym}')">Add salary</button></div>`;
  h+=`<div class="stl" style="margin-top:10px"><span>Money left this month</span><b class="num ${c.saved<0?'neg':'pos'}">${sgd(c.saved)}</b></div><div class="small muted">Salary + refunds + friends repaid − spending${c.extra>0.004?' + '+sgd(c.extra)+' of savings used':c.extra<-0.004?' − '+sgd(-c.extra)+' put aside':''}</div>`;
  return h+`<div class="btns" style="margin-top:12px"><button class="btn sm" onclick="editOpening('${ym}')">Edit opening balance</button></div></div>`;
}

/* One-time tidy-up: remove empty duplicate or junk accounts (S$0 and never used) */
function cleanupFunds(){
  const own=DB.settings.funds||[]; if(!own.length) return;
  const used=new Set(); for(const e of Object.values(DB.entries)){ if(e.del) continue; if(e.pay) used.add(e.pay); if(e.from) used.add(e.from); if(e.to) used.add(e.to); }
  const empty=f=>!(+f.amt) && !used.has(f.id);
  const seen={}; let ch=false;
  const list=own.map(f=>{ if(f.hidden) return f; const k=fkey(f.name);
    const junk = empty(f) && (/^\d+$/.test(String(f.name).trim()) || k==='lastmonthsavings' || (k==='ezlink' && f.id!=='ezlink'));
    if(junk){ ch=true; return {...f,hidden:true}; } return f; });
  if(ch){ DB.settings.funds=list; DB.settings.upd=Date.now(); }
  if(cleanFundsIn(true)) ch=true;

function cleanFundsIn(noSave){

  for(const [ym,m] of Object.entries(DB.months)){ if(!m || !Array.isArray(m.fundsIn)) continue;
    const keep=m.fundsIn.filter(id=>ok.has(id)); if(keep.length!==m.fundsIn.length){ DB.months[ym]={...m, fundsIn:keep, upd:Date.now()}; ch=true; } }
  if(ch && !noSave) save(); return ch;
}

/* ============ Calculations ============ */
function monthEntries(ym){ const out=[];
  for(const e of Object.values(DB.entries)){ if(e.del || CAT[e.cat]?.track) continue;
    if(isEmi(e)){ if(e.date.startsWith(ym)) out.push({...e, amt:0, emiOrig:e.amt}); for(const p of emiPlan(e)) if(p.ym===ym) out.push({...e, id:e.id+'#'+p.k, src:e.id, date:p.date, amt:p.amt, inst:{k:p.k,n:p.n}, emi:null}); }
    else if(e.date.startsWith(ym)) out.push(e); }
  return out; }   // borrowed money is only a reminder, never spending
function stats(ym, lite){
  const es = monthEntries(ym);
  const by = {}; CATS.forEach(c=>by[c.id]=0);
  const sub = {};   // spending per type, keyed 'cat:type'
  const daily = {}; const dailyLiving = {};
  let inrHome = 0, sentHome = 0;
  for(const e of es){
    by[e.cat] = (by[e.cat]||0) + e.amt;
    if(e.sub) sub[e.cat+':'+e.sub]=(sub[e.cat+':'+e.sub]||0)+e.amt;
    if(isSendCat(e.cat)){ sentHome += e.amt; if((e.homeCur||homeCode())===homeCode()) inrHome += (e.inr||(homeCode()===curCode()? e.amt : 0)); }
    const sign = CAT[e.cat]?.income ? -1 : 1;
    if(e.cat==='refund') continue;   // refunds don't reduce any day's spending (still taken off the month total)
    daily[e.date]=(daily[e.date]||0)+sign*e.amt;
    if(!LIVING_EXCL.has(e.cat)) dailyLiving[e.date]=(dailyLiving[e.date]||0)+sign*e.amt;
  }
  const refund = by.refund||0;
  const refundFor = {};
  const net = {...by}; delete net.refund; delete net.repaid;
  net.lent = (by.lent||0) - (by.repaid||0);
  const gross = EXP_CATS.reduce((s,c)=>s+by[c.id],0);
  const total = gross - refund - (by.repaid||0);
  const living = total - [...LIVING_EXCL].reduce((s,k)=>s+(CAT[k]?.income ? -(by[k]||0) : (by[k]||0)),0);
  const c = cfg(ym);
  const days = daysElapsed(ym);
  const budgetTotal = EXP_CATS.reduce((s,k)=>s+(+c.budgets[k.id]||0),0);
  let budgetLeft = 0;
  EXP_CATS.forEach(k=>{ const b=+c.budgets[k.id]||0; if(b>0) budgetLeft += b - net[k.id]; });
  const X = lite? 0 : fundsIncluded(ym);
  return {es, by, net, sub, sentHome, refund, refundFor, gross, total, living, inrHome, daily, dailyLiving, cfg:c, salary:+c.salary||0,
          days, left:daysLeft(ym), dim:dim(ym), budgetTotal, budgetLeft,
          extra:X, income:(+c.salary||0)+X,
          saved:(+c.salary||0) + X - total,
          avg: days? (total+refund)/days : 0, avgLiving: days? living/days : 0};
}
/* Spending (not refunds, transfers or money coming back) on one day, with the number of entries */
function daySpend(ds){ let s=0,n=0; for(const e of monthEntries(ds.slice(0,7))){ if(e.date!==ds || e.emiOrig) continue; const k=CAT[e.cat]; if(!k||k.income||k.track) continue; s+=e.amt; n++; } return {s:r2(s),n}; }
/* Daily-living pace: what's left of the living budgets (food, travel, …) spread over the days left */
const LIVING_CATS = () => BUDGET_CATS.filter(k=>!LIVING_EXCL.has(k.id));
function livingPace(st){
  const cats=LIVING_CATS(), budget=cats.reduce((a,k)=>a+(+st.cfg.budgets[k.id]||0),0), spent=r2(cats.reduce((a,k)=>a+(st.net[k.id]||0),0));
  return {budget, spent, canDay: budget>0 && st.left>0 ? (budget-spent)/st.left : null};
}
function status(spent,budget,cat){
  if(!budget) return null;
  const p = spent/budget;
  if(FIXED.has(cat)) return p>1.005?'bad':'good';   // rent / money home: paying the planned amount is on track
  if(p>1) return 'bad'; if(p>=0.85) return 'warn'; return 'good';
}

/* ============ Exchange rate (profile currency -> home currency) ============ */
async function fetchRate(date){
  const base=curCode(), to=homeCode(); if(base===to) return 1;
  const today = todayStr(), key = date+'|'+base+to;
  if(date!==today && DB.rates[key]) return DB.rates[key];
  const tag = date>=today ? 'latest' : date;
  const urls = [
    `https://api.frankfurter.dev/v1/${tag}?base=${base}&symbols=${to}`,
    `https://api.frankfurter.app/${tag}?from=${base}&to=${to}`
  ];
  for(const u of urls){
    try{ const r = await fetch(u,{cache:'no-store'}); if(r.ok){ const j = await r.json(); const v = j?.rates?.[to]; if(v){ if(date<today){ DB.rates[key]=v; persist(); } DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  }
  try{ const r = await fetch('https://open.er-api.com/v6/latest/'+base); if(r.ok){ const j=await r.json(); const v=j?.rates?.[to]; if(v){ DB.meta.lastRate=v; DB.meta.lastRatePair=base+to; return v; } } }catch(e){}
  return null;
}

function calendarView(es, days, signed, cat=S.histCat){

  h += `<div class="cal">` + ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(w=>`<div class="wd">${w}</div>`).join('');

  let weekTot=0; const weeks=[];
  for(let d=1; d<=n; d++){

    const pct = v>0 ? Math.round(12 + 68*v/mx) : 0;

    const style = v>0 ? `background:color-mix(in srgb, var(--series-1) ${pct}%, var(--surface));${dark?'color:#fff;':''}` : '';
    const cls = ['d', date===today?'today':'', date===S.selDay?'sel':'', date>today?'future':''].join(' ');
    const amt = v ? (Math.abs(v)>=1000 ? (v/1000).toFixed(1)+'k' : Math.abs(v)>=100 ? Math.round(v) : v.toFixed(v%1?1:0)) : (has?'0':'');

    <div class="kpis" style="margin-top:12px">

      <div class="kpi"><div class="l">Avg per day</div><div class="v num">${sgd(elapsed?sum/elapsed:0)}</div><div class="s">over ${elapsed} days</div></div>
      <div class="kpi"><div class="l">Highest day</div><div class="v num">${top?sgd(top[1]):'–'}</div><div class="s">${top?dayLabel(top[0]):'&nbsp;'}</div></div>
      <div class="kpi"><div class="l">No-spend days</div><div class="v num">${noSpend}</div><div class="s">of ${elapsed}</div></div>
    </div>
    <div class="small muted" style="margin-top:10px">Weekly totals: ${weeks.map((w,i)=>`<span class="num" style="color:var(--text)">W${i+1} ${sgd0(w)}</span>`).join(' · ')}</div></div>`;
  // selected day detail
  if(S.selDay){

    h += `<div class="btns" style="margin-bottom:12px"><button class="btn" onclick="openEntry(null,'${S.selDay}')">+ Add expense on ${dayLabel(S.selDay)}</button></div>`;
  } else h += `<div class="small muted" style="padding:0 4px">Tap a day to see its expenses.</div>`;

/* ============ ANALYSIS ============ */
/* ============ Analysis groups: each category is its own slice, largest first. The 8 biggest get their own colour,
   the rest are joined as "Other"; money lent to friends / paid back to friends is one "Friends" slice. ============ */
const GCOL=['var(--g1)','var(--g2)','var(--g3)','var(--g4)','var(--g5)','var(--g6)','var(--g7)','var(--g8)'];
function groupTotals(st){
  const rows=EXP_CATS.filter(k=>!k.friend).map(k=>({id:k.id, name:k.name, icon:k.icon, cats:[k.id], v:st.net[k.id]||0})).filter(r=>r.v>0.004).sort((a,b)=>b.v-a.v);
  let out=rows.slice(0,7), rest=rows.slice(7);
  if(rest.length===1) out.push(rest[0]); else if(rest.length) out.push({id:'other', name:'Other', icon:'🧾', cats:rest.flatMap(r=>r.cats), v:rest.reduce((a,r)=>a+r.v,0)});
  out=out.map((g,i)=>({...g, c:GCOL[i]}));
  const fr=(st.net.lent||0)+(st.by.payback||0);
  if(fr>0.004) out.push({id:'lent', name:'Friends', icon:'🤝', cats:['lent','payback'], v:st.net.lent||0, c:'var(--g9)'});
  return out; }
/* ============ Month summary: donut of where the salary went + savings ============ */
function firstYm(){ const ks=[...Object.values(DB.entries).filter(e=>!e.del).map(e=>e.date.slice(0,7)), ...Object.keys(DB.months).filter(k=>!DB.months[k].del)]; return ks.length? ks.sort()[0] : null; }
function savedBefore(ym){ const f=firstYm(); let m=f, sum=0, n=0; if(!f) return {sum,n}; while(m<ym){ const x=stats(m); if(x.salary){ sum+=x.saved; n++; } m=addMonths(m,1); } return {sum,n}; }
function donutSvg(parts, center1, center2){
  const tot=parts.reduce((a,p)=>a+p.v,0); if(!tot) return '';
  const R=80, r=52, C=85; let a0=-Math.PI/2, out='';
  const pt=(a,rad)=>[C+rad*Math.cos(a), C+rad*Math.sin(a)];
  for(const p of parts){
    const frac=p.v/tot, a1=a0+frac*2*Math.PI, big=frac>0.5?1:0;
    let d;
    if(frac>=0.9999){ d=`M${C-R},${C} a${R},${R} 0 1,0 ${2*R},0 a${R},${R} 0 1,0 ${-2*R},0 M${C-r},${C} a${r},${r} 0 1,1 ${2*r},0 a${r},${r} 0 1,1 ${-2*r},0Z`; }
    else { const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r);
      d=`M${x0},${y0} A${R},${R} 0 ${big},1 ${x1},${y1} L${x2},${y2} A${r},${r} 0 ${big},0 ${x3},${y3}Z`; }
    out+=`<path d="${d}" fill="${p.c}" fill-rule="evenodd" stroke="var(--surface)" stroke-width="2" data-tip="<b>${esc(p.name)}</b><br>${sgd(p.v)} · ${Math.round(frac*100)}%"/>`;
    a0=a1;
  }
  return `<svg viewBox="0 0 170 170" role="img" aria-label="Where the money went">${out}<text class="c1" x="85" y="86" text-anchor="middle">${center1}</text><text class="c2" x="85" y="103" text-anchor="middle">${center2}</text></svg>`;
}
function monthSummaryCard(ym, heading){
  const st=stats(ym);
  const parts=groupTotals(st).filter(g=>g.v>0.004).map(g=>({name:g.icon+' '+g.name, v:g.v, c:g.c}));
  const done = ym < ymOf(todayStr());            // savings are final only once the month is over
  const hasSal=st.salary>0, saved=st.saved;
  if(done && hasSal && saved>0) parts.push({name:'💰 Saved', v:saved, c:'var(--series-3)'});
  const base=parts.reduce((a,p)=>a+p.v,0);
  const prev=savedBefore(ym);
  let h=`<div class="card"><h2>${heading} · ${ymLabel(ym)}</h2>`;
  if(!base){ h+=`<div class="muted">No expenses recorded for ${ymLabel(ym)} yet.</div></div>`; return h; }
  h+=`<div class="msum">${donutSvg(parts, done&&hasSal?sgd0(st.salary):sgd0(st.total), done&&hasSal?'salary':(done?'spent':'spent so far'))}<div class="plist">`+
     parts.map(p=>`<div data-tip="<b>${esc(p.name)}</b><br>${sgd(p.v)}"><i style="--c:${p.c}"></i><span>${esc(p.name)}</span><span class="num">${sgd(p.v)}</span><span class="pc">${Math.round(p.v/base*100)}%</span></div>`).join('')+
     (done && hasSal && saved<0?`<div><i style="--c:var(--bad)"></i><span>Overspent</span><span class="num neg">${sgd(-saved)}</span><span class="pc"></span></div>`:'')+
     `</div></div>`;
  if(hasSal && !done){
    h+=`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Saved in previous months</div><div class="v num ${prev.sum<0?'neg':''}">${sgd(prev.sum)}</div><div class="s">${prev.n?prev.n+' month'+(prev.n===1?'':'s'):'no earlier months'}</div></div>
    </div><div class="small muted" style="margin-top:8px">This month’s saving is added to the chart after ${ymLabel(ym)} ends.</div>`;
  } else if(hasSal){
    h+=`<div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="l">Saved this month</div><div class="v num ${saved<0?'neg':'pos'}">${sgd(saved)}</div><div class="s">${Math.round(saved/st.salary*100)}% of salary</div></div>
      <div class="kpi"><div class="l">Saved in previous months</div><div class="v num ${prev.sum<0?'neg':''}">${sgd(prev.sum)}</div><div class="s">${prev.n?prev.n+' month'+(prev.n===1?'':'s'):'no earlier months'}</div></div>
      <div class="kpi"><div class="l">Total saved so far</div><div class="v num ${prev.sum+saved<0?'neg':'pos'}">${sgd(prev.sum+saved)}</div><div class="s">up to ${ymLabel(ym,true)}</div></div>
    </div>`;

  return h+`</div>`;

/* Daily-living spending so far (filled) against an even pace to the living budget (line) */
function paceChart(st){
  const pace=livingPace(st), n=st.dim, today=st.days;
  if(!pace.budget) return '<div class="muted small">Set budgets for food, travel and other daily costs to see your pace.</div>';
  const W=chartW(), H=150, L=40, Rr=8, T=10, Bt=24, iw=W-L-Rr, ih=H-T-Bt;
  let cum=0; const pts=[[0,0]];
  for(let d=1; d<=today; d++){ const ds=S.ym+'-'+pad(d); cum+=st.dailyLiving[ds]||0; pts.push([d,cum]); }
  const mx=niceMax(Math.max(pace.budget,cum)), x=d=>L+d/n*iw, y=v=>T+ih-(v/mx)*ih;
  const area='M'+x(0)+','+y(0)+' '+pts.map(p=>'L'+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')+' L'+x(today)+','+y(0)+'Z';
  const line=pts.map((p,i)=>(i?'L':'M')+x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ');
  const expNow=pace.budget*today/n, ok=cum<=expNow;
  let g=''; const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk; g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${sgd0(v).replace(/^[^0-9]+/,'')}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Living spending ${sgd0(cum)} so far against a budget pace of ${sgd0(expNow)}">${g}
    <path d="M${x(0)},${y(0)} L${x(n)},${y(pace.budget)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <path d="${area}" fill="var(--series-1)" opacity=".16"/><path d="${line}" stroke="var(--series-1)" stroke-width="2.5" fill="none"/>
    <circle cx="${x(today)}" cy="${y(cum)}" r="4" fill="var(--series-1)"/>
    <text x="${L}" y="${H-6}">1</text><text x="${x(today)}" y="${H-6}" text-anchor="middle">today</text><text x="${W-Rr}" y="${H-6}" text-anchor="end">${n}</text></svg>
    <div class="small" style="margin-top:6px">Spent <b class="num">${sgd(cum)}</b> on daily living by day ${today}. An even pace to your ${sgd0(pace.budget)} living budget would be <b class="num">${sgd(expNow)}</b> — <b class="${ok?'pos':'neg'}">${ok?sgd(expNow-cum)+' under':sgd(cum-expNow)+' over'}</b>.</div>`;
}

function deltaTxt(a,b){ if(!b) return '&nbsp;'; const d=(a-b)/b*100; return (d>=0?'▲ ':'▼ ')+Math.abs(Math.round(d))+'% vs last month'; }
function insights(st,prev){
  const out=[];
  if(!st.es.length) return out;
  const top = BUDGET_CATS.map(k=>({k,v:st.net[k.id]})).filter(x=>!LIVING_EXCL.has(x.k.id)).sort((a,b)=>b.v-a.v)[0];
  if(top && top.v>0) out.push(`Biggest day-to-day category: <b>${esc(top.k.icon)} ${esc(top.k.name)}</b> at ${sgd(top.v)} (${sgd(st.days?top.v/st.days:0)}/day).`);
  const wt=EXP_CATS.filter(k=>k.subs&&k.subs.length&&st.net[k.id]>0).sort((a,b)=>st.net[b.id]-st.net[a.id])[0];
  if(wt){ const t=wt.subs.map(x=>({x,v:st.sub[wt.id+':'+x.id]||0})).sort((a,b)=>b.v-a.v)[0]; if(t && t.v>0) out.push(`Within ${esc(wt.name.toLowerCase())}, <b>${esc(t.x.name)}</b> costs the most: ${sgd(t.v)} this month.`); }
  if(st.salary && st.budgetTotal>st.salary) out.push(`<span class="pill bad">Plan</span> Budgets total <b>${sgd0(st.budgetTotal)}</b>, which is <b>${sgd0(st.budgetTotal-st.salary)}</b> more than your salary.`);
  const over = EXP_CATS.filter(k=>{const b=+st.cfg.budgets[k.id]||0; return b && st.net[k.id]>b;});
  if(over.length) out.push(`<span class="pill bad">Over budget</span> ${over.map(k=>esc(k.name)).join(', ')}.`);
  const near = EXP_CATS.filter(k=>status(st.net[k.id],+st.cfg.budgets[k.id]||0,k.id)==='warn');
  if(near.length) out.push(`<span class="pill warn">Near limit</span> ${near.map(k=>esc(k.name)).join(', ')} (85%+ used).`);
  if(st.left>0 && st.days>0){
    const proj = st.total + st.avgLiving*(st.left-1);
    out.push(`At your current daily-living pace, you'll spend about <b>${sgd0(proj)}</b> this month${st.salary?` and save about <b class="${st.salary-proj<0?'neg':'pos'}">${sgd0(st.salary-proj)}</b>`:''}.`);
  }
  if(prev.total>0 && prev.days){
    const d = st.avgLiving - prev.avgLiving;
    if(Math.abs(d)>=0.5) out.push(`Daily living average is <b>${sgd(Math.abs(d))} ${d>0?'higher':'lower'}</b> than last month (${sgd(prev.avgLiving)}/day).`);
  }
  return out;
}

function chartW(){ const w=(document.querySelector('main')?.clientWidth||400)-62; return Math.max(300,Math.min(700,w)); }
function ticks(mx){ const lead=Math.round(mx/Math.pow(10,Math.floor(Math.log10(mx)))); return lead===2?4:5; }
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); const n=v/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function dailyChart(st){

  const y = v => T + (H-T-B)*(1-Math.max(0,v)/mx);
  const avg = S.dailyMode==='living'? st.avgLiving : st.avg;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily spending bar chart">`;
  const tk=ticks(mx); for(let i=0;i<=tk;i++){ const v=mx*i/tk, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${v>=1000?(v/1000)+'k':Math.round(v)}</text>`; }
  vals.forEach((v,i)=>{

    s+=`<rect x="${L+i*cw}" y="${T}" width="${cw}" height="${H-T-B}" fill="transparent" data-tip="${esc(dayLabel(date))}: ${sgd(v)}"/>`;

  s += `<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--muted)"/></svg>`;

function trendChart(){
  const months = Array.from({length:6},(_,i)=>addMonths(S.ym,i-5));
  const data = months.map(m=>{ const s=stats(m); return {m, spent:s.total, saved: s.salary? s.saved : 0, salary:s.salary, home: homeCode()!==curCode()? s.inrHome : s.sentHome}; });
  const W=chartW(),H=210,L=44,R=8,T=10,B=24;
  const mx = niceMax(Math.max(1,...data.map(d=>Math.max(d.spent,d.saved))));
  const mn = Math.min(0,...data.map(d=>d.saved)); const lo = mn<0? -niceMax(-mn):0;
  const y = v => T + (H-T-B)*(mx-v)/(mx-lo);
  const gw=(W-L-R)/6, bw=Math.min(28,(gw-14)/2);
  let s=`<div class="legend"><span style="--c:var(--series-1)">Spent</span><span style="--c:var(--series-3)">Saved</span></div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Spent vs saved per month">`;
  for(let i=0;i<=4;i++){ const v=lo+(mx-lo)*i/4, yy=y(v); s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--grid)"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${Math.abs(v)>=1000?(Math.round(v/100)/10)+'k':Math.round(v)}</text>`; }
  const bar=(x,v,col)=>{ if(!v) return ''; const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y1-y0); const rr=Math.min(4,h);
    return v>0 ? `<path d="M${x},${y0} V${top+rr} q0,-${rr} ${rr},-${rr} H${x+bw-rr} q${rr},0 ${rr},${rr} V${y0}Z" fill="${col}"/>` : `<path d="M${x},${y0} V${top+h-rr} q0,${rr} ${rr},${rr} H${x+bw-rr} q${rr},0 ${rr},-${rr} V${y0}Z" fill="${col}"/>`; };
  data.forEach((d,i)=>{
    const gx=L+i*gw+(gw-2*bw-2)/2;
    s+=bar(gx,d.spent,'var(--series-1)')+bar(gx+bw+2,d.saved,'var(--series-3)');
    s+=`<rect x="${L+i*gw}" y="${T}" width="${gw}" height="${H-T-B}" fill="transparent" data-tip="<b>${ymLabel(d.m,true)}</b><br>Spent ${sgd(d.spent)}<br>Saved ${d.salary?sgd(d.saved):'– (no salary set)'}"/>`;
    s+=`<text x="${L+i*gw+gw/2}" y="${H-6}" text-anchor="middle" ${d.m===S.ym?'style="fill:var(--text);font-weight:600"':''}>${ymLabel(d.m,true).split(' ')[0]}</text>`;
  });
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)"/></svg>`;
  s+=`<div class="tablewrap" style="margin-top:8px"><table class="t"><thead><tr><th>Month</th><th>Salary</th><th>Spent</th><th>Saved</th><th>Rate</th><th>Sent home</th></tr></thead><tbody>`+
    data.slice().reverse().map(d=>`<tr><td>${ymLabel(d.m,true)}</td><td class="num">${d.salary?sgd0(d.salary):'–'}</td><td class="num">${sgd0(d.spent)}</td><td class="num ${d.saved<0?'neg':''}">${d.salary?sgd0(d.saved):'–'}</td><td class="num">${d.salary?Math.round(d.saved/d.salary*100)+'%':'–'}</td><td class="num">${d.home?(homeCode()!==curCode()?inr(d.home):sgd0(d.home)):'–'}</td></tr>`).join('')+`</tbody></table></div>`;
  return s;
}

    $('#bSum').innerHTML=`<div class="bsum"><div><span>Income</span><b class="num">${sgd0(salary)}</b></div><div><span>Budgeted</span><b class="num">${sgd0(total)}</b></div><div><span>Planned saving</span><b class="num ${saving<0?'neg':'pos'}">${saving<0?'−':''}${sgd0(Math.abs(saving))}</b></div></div>
      ${extra>0.004?`<div class="small muted" style="margin-top:6px">Includes ${sgd(extra)} of last month's savings in your Spending accounts.</div>`:extra<-0.004?`<div class="small muted" style="margin-top:6px">${sgd(-extra)} of this month's money is put aside in the emergency fund.</div>`:''}
      ${saving<0&&salary?`<div class="warnbox">Budgets are ${sgd(-saving)} more than your income${extra>0.004?' and the savings you included':''}. Lower a budget${trackBal()&&funds().some(f=>isEF(f,S.ym))?', or switch an emergency account to Spending in Settings → Accounts':''}.</div>`:''}`; };
  const persistB=()=>{ const {budgets,salary}=read(); setMonthFlag(S.ym,{salary, budgets}); toast('Saved'); summary();
    setTimeout(()=>{ const a=document.activeElement; if(S.tab==='budget' && !(a && a.tagName==='INPUT' && root.contains(a))) renderBudget(); },400); };
  root.querySelectorAll('[data-b], #bSalary').forEach(i=>{ i.oninput=summary; i.onchange=persistB; });
  summary();
  confirmBtn($('#bCopyNext'),'Tap again to copy',()=>{ const {budgets,salary}=read(); setMonthFlag(next,{salary, budgets}); toast('Copied to '+ymLabel(next)); renderBudget(); });
}

/* ============ Ways you pay (used when balances are not tracked): add, rename, reorder, remove ============ */
const PAY_TYPES = {bank:{icon:'🏦', label:'Bank / debit card', ex:'e.g. DBS, Chase, HDFC'}, cash:{icon:'💵', label:'Cash', ex:'Cash'}, wallet:{icon:'📱', label:'E-wallet / app', ex:'e.g. PayPal, GPay, PayNow'},
  card:{icon:'💳', label:'Prepaid / transport card', ex:'e.g. Transit card'}, credit:{icon:'🧾', label:'Credit card / PayLater', ex:'e.g. Visa, PayLater'}};
let PAY_MODE='';   // '' | 'order' | 'del'
function paySheet(mode){
  if(mode!==undefined) PAY_MODE=mode; const all=funds(), ym=curYM(), ord=PAY_MODE==='order', del=PAY_MODE==='del';
  const paid=id=>acctTx(id).filter(x=>x.d<0 && x.e.date.startsWith(ym) && x.e.cat!=='xfer').reduce((a,x)=>a-x.d,0);
  const row=(f,k)=>{ const c=isCredit(f), sub = c? `Credit · ${owedOf(f)>0.004? 'you owe '+sgd(owedOf(f))+' · ' : ''}due ${niceDate(nextDue(f))}` : `Paid ${sgd(paid(f.id))} in ${ymLabel(ym,true).split(' ')[0]}`;
    const ctl = ord? `<span class="ordb"><button class="btn sm" data-pup="${esc(f.id)}" aria-label="Move ${esc(f.name)} up" ${k===0?'disabled':''}>▲</button><button class="btn sm" data-pdn="${esc(f.id)}" aria-label="Move ${esc(f.name)} down" ${k===all.length-1?'disabled':''}>▼</button></span>`
      : del? `<button class="btn sm danger" data-pdel="${esc(f.id)}">Delete</button>` : `<span class="muted">›</span>`;
    return `<div class="ar"><button class="srcb" data-pacct="${esc(f.id)}"><span class="ic">${esc(f.icon||'💰')}</span><span class="t" style="min-width:0"><span style="display:block;font-weight:650">${esc(f.name)}</span><span class="small muted" style="display:block">${sub}</span></span></button>${ctl}</div>`; };
  openSheet(`<div class="sheettop"><h3>Ways you pay</h3><button class="btn sm" onclick="closeSheet()">Close</button></div>
    <div class="small muted" style="margin-top:6px">Pick one when you add an expense to see where your money goes. Balances aren’t tracked: your budget does the maths.</div>
    ${ord||del? `<div class="stdiff ${del?'bad':''}" style="margin-top:10px"><span>${del?'Tap Delete twice to remove. Past entries keep their history.':'Reorder with ▲ ▼. This order is used when you add an expense.'}</span></div><div class="btns" style="margin-top:8px"><button class="btn primary" id="pyDone" style="flex:1">Done</button></div>`
      : `<div class="iconbar"><button class="btn primary" id="pyAddT">＋ Add</button>${all.length>1?'<button class="btn" id="pyOrd">↕ Order</button>':''}${all.length?'<button class="btn danger" id="pyDel" aria-label="Remove">🗑</button>':''}</div>`}
    <div id="pyAddBox" class="${all.length?'hidden ':''}card" style="margin-top:12px;box-shadow:none;border:1px solid var(--border)"><h2>Add a way to pay</h2>
      <div class="chips" id="pyType">${Object.entries(PAY_TYPES).map(([k,t],i)=>`<button class="chip ${i===0?'on':''}" data-pt="${k}">${t.icon} ${t.label}</button>`).join('')}</div>
      <label class="f" for="pyName">Name</label><input class="in" id="pyName" placeholder="${PAY_TYPES.bank.ex}" autocomplete="off" maxlength="30">
      <div class="grid2 hidden" id="pyCr"><div><label class="f" for="pyLim">Credit limit (optional)</label><input class="in num" id="pyLim" type="number" inputmode="decimal" placeholder="e.g. 1000"></div><div><label class="f" for="pyDue">Bill due day (1–28)</label><input class="in num" id="pyDue" type="number" inputmode="numeric" min="1" max="28" value="1"></div></div>
      <div class="btns" style="margin-top:10px"><button class="btn primary" id="pyAdd">Add</button></div></div>
    <div class="acsec" style="margin-top:12px">${all.map(row).join('') || '<div class="empty">Nothing added yet. Add your bank card, cash, wallet apps or credit cards.</div>'}</div>
    ${ord||del?'':`<div class="small muted" style="margin:10px 2px 0">Want the app to keep track of what’s in each account too? <button class="lnk" style="float:none" id="pyTrack">Track balances</button></div>`}`);
  if($('#pyDone')) $('#pyDone').onclick=()=>paySheet('');
  if($('#pyOrd')) $('#pyOrd').onclick=()=>paySheet('order');
  if($('#pyDel')) $('#pyDel').onclick=()=>paySheet('del');
  if($('#pyTrack')) $('#pyTrack').onclick=()=>{ DB.settings.trackBal=true; DB.settings.upd=Date.now(); save(); render(); toast('Balance tracking on — enter what’s in each account'); balancesSheet({settings:true}); };
  if($('#pyAddT')) $('#pyAddT').onclick=()=>{ $('#pyAddBox').classList.toggle('hidden'); if(!$('#pyAddBox').classList.contains('hidden')) $('#pyName').focus(); };
  let type='bank';
  document.querySelectorAll('[data-pt]').forEach(b=>b.onclick=()=>{ type=b.dataset.pt; document.querySelectorAll('[data-pt]').forEach(x=>x.classList.toggle('on',x===b)); $('#pyCr').classList.toggle('hidden',type!=='credit'); $('#pyName').placeholder=PAY_TYPES[type].ex; if(type==='cash' && !$('#pyName').value) $('#pyName').value='Cash'; });
  $('#pyAdd').onclick=()=>{ const n=($('#pyName').value||'').trim()||(type==='cash'?'Cash':''); if(!n){ toast('Type a name, e.g. the bank or card'); $('#pyName').focus(); return; }
    if(funds().some(f=>f.name.trim().toLowerCase()===n.toLowerCase())){ toast(n+' is already in the list'); return; }
    const now=Date.now(), f={id:'f'+now.toString(36), name:n, icon:PAY_TYPES[type].icon, amt:0, kind:type};
    if(type==='credit') Object.assign(f,{credit:true, limit:r2(Math.max(0,+$('#pyLim').value||0)), due:Math.min(28,Math.max(1,parseInt($('#pyDue').value)||1))});
    saveFunds([...allFunds(), f]); render(); toast('Added '+n); paySheet(''); };
  document.querySelectorAll('[data-pacct]').forEach(b=>b.onclick=()=>{ if(!ord && !del) accountSheet(b.dataset.pacct,'pay'); });
  const mv=(id,dir)=>{ const vis=funds().map(f=>f.id), i=vis.indexOf(id), j=i+dir; if(i<0||j<0||j>=vis.length) return;
    const list=allFunds(), a=list.findIndex(f=>f.id===id), b=list.findIndex(f=>f.id===vis[j]); [list[a],list[b]]=[list[b],list[a]]; saveFunds(list); render(); paySheet(); };
  document.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>mv(b.dataset.pup,-1));
  document.querySelectorAll('[data-pdn]').forEach(b=>b.onclick=()=>mv(b.dataset.pdn,1));
  document.querySelectorAll('[data-pdel]').forEach(b=>confirmBtn(b,'Tap again',()=>{ const id=b.dataset.pdel, f=funds().find(x=>x.id===id);
    saveFunds(allFunds().map(x=>x.id===id?{...x,hidden:true}:x)); render(); toast((f?f.name:'Account')+' removed'); paySheet(funds().length?'del':''); }));
}

/* ============ Categories editor ============ */
const EMOJIS=['🍽️','🛒','🚌','🚗','⛽','🏠','💡','📱','📺','🎬','🎮','🛍️','👕','💊','💇','🧺','📚','🎁','🐾','🧸','✈️','🏋️','☕','🍺','💸','🧾','🛕','💼','🎓','🧴','🚕','🏦'];
function saveCats(list){ DB.settings.cats=list.map(c=>{ const o={...c}; if(!o.subs||!o.subs.length) delete o.subs; return o; }); DB.settings.upd=Date.now(); save(); buildCats(); }
function catSheet(){
  const list=userCats(), vis=list.filter(c=>!c.hidden), hid=list.filter(c=>c.hidden);
  const row=(c,i)=>`<div class="ar"><button class="srcb" data-ced="${esc(c.id)}"><span class="ic">${esc(c.icon)}</span><span class="t" style="min-width:0"><span style="display:block;font-weight:650">${esc(c.name)}</span><span class="small muted" style="display:block">${CAT_KINDS[c.kind]}${c.subs&&c.subs.length?' · '+c.subs.length+' type'+(c.subs.length===1?'':'s'):''}${c.reason?' · asks for a reason':''}${c.send?' · money sent home':''}</span></span></button>
    <span class="ordb"><button class="btn sm" data-cup="${esc(c.id)}" aria-label="Move ${esc(c.name)} up" ${i===0?'disabled':''}>▲</button><button class="btn sm" data-cdn="${esc(c.id)}" aria-label="Move ${esc(c.name)} down" ${i===vis.length-1?'disabled':''}>▼</button></span></div>`;
  openSheet(`<div class="sheettop"><h3>Categories</h3><button class="btn sm" onclick="closeSheet()">Close</button></div>
    <div class="small muted" style="margin-top:6px">Tap a category to rename it, change its emoji, add types (like Breakfast or Lunch) or remove it. ▲ ▼ sets the order on the Add screen.</div>
    <div class="btns" style="margin-top:10px"><button class="btn primary" id="cAdd" style="flex:1">＋ Add category</button></div>
    <div class="acsec" style="margin-top:12px">${vis.map(row).join('')||'<div class="empty">No categories. Add one to start.</div>'}</div>
    <div class="small muted" style="margin:10px 2px 0"><b>Daily living</b> counts in your daily pace. <b>Monthly bills</b> and <b>one-offs</b> are left out of it, so rent doesn’t make every day look expensive.</div>
    ${hid.length?`<details style="margin-top:12px"><summary class="small muted">Removed (${hid.length})</summary><div class="acsec">${hid.map(c=>`<div class="ar"><span class="srcb"><span class="ic">${esc(c.icon)}</span><span class="t"><span style="display:block;font-weight:650">${esc(c.name)}</span><span class="small muted">Old entries still show</span></span></span><button class="btn sm" data-crest="${esc(c.id)}">Restore</button></div>`).join('')}</div></details>`:''}`);
  $('#cAdd').onclick=()=>catEdit(null);
  document.querySelectorAll('[data-ced]').forEach(b=>b.onclick=()=>catEdit(b.dataset.ced));
  const mv=(id,dir)=>{ const L=userCats(), v=L.filter(c=>!c.hidden).map(c=>c.id), i=v.indexOf(id), j=i+dir; if(i<0||j<0||j>=v.length) return;
    const a=L.findIndex(c=>c.id===id), b=L.findIndex(c=>c.id===v[j]); [L[a],L[b]]=[L[b],L[a]]; saveCats(L); render(); catSheet(); };
  document.querySelectorAll('[data-cup]').forEach(b=>b.onclick=()=>mv(b.dataset.cup,-1));
  document.querySelectorAll('[data-cdn]').forEach(b=>b.onclick=()=>mv(b.dataset.cdn,1));
  document.querySelectorAll('[data-crest]').forEach(b=>b.onclick=()=>{ saveCats(userCats().map(c=>c.id===b.dataset.crest?{...c,hidden:false}:c)); render(); toast('Restored'); catSheet(); });
}
function catEdit(id){
  const list=userCats(), c=id? list.find(x=>x.id===id) : {id:null, name:'', icon:'🏷️', kind:'living'};
  if(!c){ catSheet(); return; }
  let subs=(c.subs||[]).map(t=>({...t})), kind=c.kind||'living';
  const used=id? Object.values(DB.entries).some(e=>!e.del && e.cat===id) : false, showSend = homeCode()!==curCode() || c.send;
  openSheet(`<div class="sheettop"><h3>${id?'Edit category':'New category'}</h3><button class="btn sm" id="ceBack">Back</button></div>
    <div class="grid2" style="grid-template-columns:76px 1fr"><div><label class="f" for="ceIcon">Emoji</label><input class="in" id="ceIcon" value="${esc(c.icon)}" maxlength="4" style="text-align:center;font-size:20px" autocomplete="off"></div>

    <label class="f">What kind of spending?</label><div class="seg" id="ceKind">${Object.entries(CAT_KINDS).map(([k,l])=>`<button data-k="${k}" class="${k===kind?'on':''}">${l}</button>`).join('')}</div>
    <div class="small muted" id="ceKindTxt" style="margin-top:6px"></div>
    <label class="sit" style="margin-top:10px;padding:10px 0;border:0"><span>Always ask for a reason</span><input type="checkbox" class="tgl" id="ceReason" ${c.reason?'checked':''}></label>
    ${showSend?`<label class="sit" style="padding:10px 0;border:0"><span>Money sent home<span class="small muted" style="display:block;font-weight:400">${homeCode()!==curCode()?'Also saves the amount in '+homeCode():'Set a home currency in Settings → Currency'}</span></span><input type="checkbox" class="tgl" id="ceSend" ${c.send?'checked':''}></label>`:''}
    <label class="f">Types inside this category (optional)</label>
    <div class="small muted" style="margin-bottom:6px">For example Breakfast, Lunch, Dinner in Food. When a category has types, you pick one each time.</div>
    <div id="ceSubs"></div>
    <div class="row" style="gap:8px;margin-top:8px"><input class="in" id="ceSubNew" placeholder="Add a type, e.g. Lunch" maxlength="30" autocomplete="off" style="flex:1"><button class="btn" id="ceSubAdd">Add</button></div>
    ${id? '<div class="actrow"><button class="btn danger" id="ceDel">Remove</button><button class="btn primary" id="ceSave">Save</button></div>' : '<div style="margin-top:16px"><button class="btn primary bigsave" id="ceSave">Add category</button></div>'}
    ${id&&used?'<div class="small muted" style="margin-top:6px;text-align:center">Removing hides it from the Add screen. Entries you already made keep it.</div>':''}`);
  const kt={living:'Everyday spending like food or transport. Counts in your daily pace.', bill:'Paid about once a month, like rent or phone. Not in the daily pace.', oneoff:'Now-and-then spending like gifts or repairs. Not in the daily pace.'};
  const drawKind=()=>{ document.querySelectorAll('#ceKind [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===kind)); $('#ceKindTxt').textContent=kt[kind]; };
  const drawSubs=()=>{ $('#ceSubs').innerHTML = subs.length? `<div class="chips">${subs.map((t,i)=>`<span class="chip on" style="gap:6px">${esc(t.icon)} ${esc(t.name)} <button class="lnk" data-sdel="${i}" aria-label="Remove ${esc(t.name)}" style="float:none;margin:0;font-size:15px">✕</button></span>`).join('')}</div>` : '<div class="small muted">No types.</div>';

    const pend=($('#ceSubNew').value||'').trim(); if(pend && !subs.some(t=>t.name.toLowerCase()===pend.toLowerCase())) subs.push({id:'t'+Date.now().toString(36)+subs.length, name:pend, icon:'•'});

  if($('#ceDel')) confirmBtn($('#ceDel'),'Tap again to remove',()=>{ const L=userCats(); saveCats(used? L.map(x=>x.id===id?{...x,hidden:true}:x) : L.filter(x=>x.id!==id)); render(); toast(c.name+' removed'); catSheet(); });
}

let W=null;
function guessCurrency(){ const r=((navigator.language||'').split('-')[1]||'').toUpperCase();

                     : [...DEFAULT_CATS.map(c=>({...c, on: c.send? false : true})), ...EXTRA_CATS.map(c=>({...c,on:false}))];

function finishWizard(){
  const p=curProfile(), now=Date.now(), ym=curYM();
  p.name=W.name.slice(0,24); p.currency=W.cur; if(W.home && W.home!==W.cur) p.homeCur=W.home; else delete p.homeCur; saveProfiles(); renderProfileBtn();
  const used=new Set(Object.values(DB.entries).filter(e=>!e.del).map(e=>e.cat));
  DB.settings.cats = W.cats.filter(c=>c.on || (W.rerun && used.has(c.id) && userCats().some(u=>u.id===c.id))).map(c=>{ const o={...c}; if(!c.on) o.hidden=true; else delete o.hidden; delete o.on; delete o.budget; if(!o.subs||!o.subs.length) delete o.subs; return o; });
  const old=allFunds(); let k=0;
  const chosen=W.pays.filter(x=>x.on).map(x=>{ const t=PAY_TYPES[x.type]||PAY_TYPES.bank, prev=x.id? old.find(f=>f.id===x.id) : null, b=parseFloat(x.bal);
    const f={...(prev||{}), id: prev? prev.id : 'f'+now.toString(36)+(k++), name:(x.name||'').trim()||t.label, icon: prev? (prev.icon||t.icon) : t.icon, kind:x.type};
    if(!prev) f.amt=0;
    if(x.type==='credit'){ f.credit=true; f.due=Math.min(28,Math.max(1,parseInt(x.due)||1)); } else { delete f.credit; }
    if(W.track && !isNaN(b)){ const v = x.type==='credit'? -Math.abs(b) : b; if(!prev || Math.abs(v-(prev.credit? liveBal(prev) : liveBal(prev)))>0.004){ f.amt=r2(v); f.at=now; } }
    return f; });
  const keepIds=new Set(chosen.map(f=>f.id));
  DB.settings.funds=[...chosen, ...old.filter(f=>!keepIds.has(f.id)).map(f=>({...f, hidden:true}))];
  DB.settings.trackBal=!!W.track; DB.settings.setupDone=true; DB.settings.upd=now;
  const budgets={}; W.cats.forEach(c=>{ const v=+c.budget||0; if(c.on && v>0) budgets[c.id]=r2(v); });
  const c=cfg(ym); setMonthFlag(ym,{salary: W.salary===''? (+c.salary||0) : r2(+W.salary||0), budgets: Object.keys(budgets).length || W.rerun? budgets : (c.budgets||{})});
  buildCats(); save(); const rr=W.rerun; closeWizard(); S.tab='home'; render(); window.scrollTo(0,0);
  if(DB.settings.trackBal) try{ ensureOpening(); }catch(e){}
  toast(rr? 'Setup saved' : 'All set, '+p.name+'! Tap + to add your first expense');
}

/* ============ Friends: money lent / borrowed and paid back (stored as entries so it syncs) ============ */
const FTX = {
  lend:{A:'lent', B:'repaid', icon:'🤝', title:'Friends owe you', owes:'owes you', times:'lent', empty:'Lent money to a friend? Tap to keep track',
    none:'Nobody owes you anything right now.', add:'+ Lent money', addB:'+ Got money back', more:'+ Lend more', backBtn:'Got money back',
    kA:'Owes you', kT:'Total lent', note:'Lending counts as spending until it’s paid back.',
    fA:'🤝 Money lent', fB:'💵 Money paid back', amtA:'Amount given', amtB:'Amount received', iA:'Lent', iB:'Paid back',
    tA:(n,a)=>`Lent ${a} to ${n}`, tB:(n,a)=>`${n} paid back ${a}`},
  owe:{A:'borrowed', B:'payback', icon:'🙏', title:'You owe friends', owes:'you owe', times:'borrowed', empty:'Borrowed from a friend? Tap to keep track',
    none:'You don’t owe anyone right now.', add:'+ Borrowed money', addB:'+ Paid back', more:'+ Borrow more', backBtn:'Pay back',
    kA:'You owe', kT:'Total borrowed', note:'Borrowing isn’t counted as spending. Paying it back is.',
    fA:'🙏 Money borrowed', fB:'📤 Paid back to friend', amtA:'Amount borrowed', amtB:'Amount paid', iA:'Borrowed', iB:'Paid back',
    tA:(n,a)=>`Borrowed ${a} from ${n}`, tB:(n,a)=>`Paid ${a} back to ${n}`}};
const fdir = cat => CAT[cat]?.owe ? 'owe' : 'lend';
function friendLedger(dir='lend'){
  const T=FTX[dir], map={};
  for(const e of Object.values(DB.entries)){ if(e.del || (e.cat!==T.A && e.cat!==T.B)) continue;
    const n=(e.friend||'Friend').trim(), k=n.toLowerCase(); const f=map[k]||(map[k]={name:n, lent:0, back:0, items:[]});
    if(e.cat===T.A) f.lent+=e.amt; else f.back+=e.amt; f.items.push(e); }
  return Object.values(map).map(f=>({...f, owed:r2(f.lent-f.back), items:f.items.sort((a,b)=>b.date.localeCompare(a.date)||(b.cr||0)-(a.cr||0))}))
    .sort((a,b)=>b.owed-a.owed || a.name.localeCompare(b.name));
}
function splitCard(){
  const row=dir=>{ const T=FTX[dir], open=friendLedger(dir).filter(f=>f.owed>0.004), tot=open.reduce((a,f)=>a+f.owed,0);

      <div class="t"><div>${T.title}</div><div>${open.length? open.slice(0,3).map(f=>esc(f.name)+' '+sgd0(f.owed)).join(' · ')+(open.length>3?' · +'+(open.length-3)+' more':'') : T.empty}</div></div>
      <div class="num" style="font-weight:700">${sgd(tot)}</div></div>`; };
  return `<div class="card"><h2>🤝 Split with friends</h2><div class="list" style="border:0">${row('lend')}${row('owe')}</div></div>`;
}
function friendsCard(dir='lend'){
  const T=FTX[dir], L=friendLedger(dir), open=L.filter(f=>f.owed>0.004), tot=open.reduce((a,f)=>a+f.owed,0);

    <div class="small muted">${open.length? open.slice(0,3).map(f=>esc(f.name)+' '+sgd0(f.owed)).join(' · ')+(open.length>3?' · +'+(open.length-3)+' more':'') : T.empty}</div></div></div>
    <div class="num" style="font-weight:700;font-size:18px">${sgd(tot)}</div></div></div>`;

function friendsSheet(dir='lend'){
  const T=FTX[dir], L=friendLedger(dir), open=L.filter(f=>f.owed>0.004), done=L.filter(f=>f.owed<=0.004), tot=open.reduce((a,f)=>a+f.owed,0);
  const row=f=>{ const n=f.items.filter(e=>e.cat===T.A).length; return `<div class="ent frow2" data-fr="${esc(f.name)}" style="cursor:pointer"><div class="ic">${esc(f.name.slice(0,1).toUpperCase())}</div>
    <div class="t"><div>${esc(f.name)}</div><div>${n} time${n===1?'':'s'} ${T.times} · last ${dayLabel(f.items[0].date)}</div></div>
    <div class="num" style="font-weight:700;text-align:right">${f.owed>0.004?sgd(f.owed):'<span class="pos">Settled ✓</span>'}<div class="small muted" style="font-weight:400">${f.owed>0.004?T.owes:''}</div></div></div>`; };

    <div class="btns" style="margin-top:10px"><button class="btn primary" id="fLend">${T.add}</button>${open.length?`<button class="btn" id="fBack">${T.addB}</button>`:''}</div>`;

}
function friendDetail(name, dir='lend'){

    <div class="kpis" style="margin-top:8px">
      <div class="kpi"><div class="l">${T.kA}</div><div class="v num ${f.owed>0.004?'':'pos'}">${f.owed>0.004?sgd(f.owed):'Settled ✓'}</div></div>
      <div class="kpi"><div class="l">${T.kT}</div><div class="v num">${sgd(f.lent)}</div><div class="s">paid back ${sgd(f.back)}</div></div></div>
    <div class="btns" style="margin-top:10px"><button class="btn primary" id="fdLend">${T.more}</button>${f.owed>0.004?`<button class="btn" id="fdBackAmt">${T.backBtn}</button>`:''}</div>
    <div class="list" style="margin-top:10px">${f.items.map(item).join('')}</div>

  if($('#fdBackAmt')) $('#fdBackAmt').onclick=()=>friendForm(T.B,f.name,null,f.owed);
  document.querySelectorAll('[data-fe]').forEach(r=>r.onclick=()=>friendForm(null,null,DB.entries[r.dataset.fe]));
}
function friendForm(kind, name, src, amt){
  const e = src || {id:null, cat:kind, friend:name||'', amt: amt? r2(amt):'', date: todayStr(), note:''};
  const dir=fdir(e.cat), T=FTX[dir], first = e.cat===T.A;
  let pay = e.id? (e.pay||'') : lastPay();

/* ============ Calculator: numbers, + − × ÷, %, brackets. Own parser (no eval). ============ */
let CALC='';
function calcEval(src){
  const t=String(src).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-'); let i=0;
  const peek=()=>t[i], eat=c=>{ if(t[i]===c){ i++; return true; } return false; };
  function num(){ const m=/^\d*\.?\d+|^\d+\./.exec(t.slice(i)); if(!m) throw 0; i+=m[0].length; return parseFloat(m[0]); }
  function prim(){ let v; if(eat('-')) return {v:-val(prim())};
    if(eat('(')){ v=expr(); if(!eat(')')) throw 0; } else v=num();
    if(eat('%')) return {v, pct:true}; return {v}; }
  const val=p=>p.pct? p.v/100 : p.v;
  function term(){ const f=prim(); let v=val(f), single=true;
    while(peek()==='*'||peek()==='/'){ single=false; const o=t[i++], g=val(prim()); if(o==='*') v*=g; else { if(g===0) throw 0; v/=g; } }
    return single&&f.pct? {v:f.v, pct:true, pv:v} : {v}; }
  function expr(){ const a=term(); let v=a.pct? a.pv : a.v;
    while(peek()==='+'||peek()==='-'){ const o=t[i++], b=term(); const d=b.pct? v*b.v/100 : b.v; v = o==='+'? v+d : v-d; }
    return v; }
  if(!t.trim()) throw 0; const v=expr(); if(i!==t.length || !isFinite(v)) throw 0; return v;
}
function calcFmt(v){ const r=Math.round(v*100)/100; return r.toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function calcSheet(){
  const keys=['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+','C','%','( )','='];
  openSheet(`<div class="sheettop"><h3>🧮 Calculator</h3><button class="btn sm" onclick="closeSheet()">Close</button></div>
    <div class="calcpad"><div class="expr num" id="cExpr"></div><div class="res num" id="cRes"></div>
    <div class="keys">${keys.map(k=>`<button data-k="${k}" class="${'÷×−+'.includes(k)&&k.length===1?'op':k==='='?'eq':k==='C'?'c':k==='( )'?'op':''}" aria-label="${k==='⌫'?'Delete':k==='( )'?'Brackets':k}">${k}</button>`).join('')}</div></div>
    <div class="btns"><button class="btn" id="cCopy" style="flex:1">Copy result</button><button class="btn primary" id="cAdd" style="flex:1">+ Add as expense</button></div>`);
  const res=()=>{ try{ return calcEval(CALC); }catch(e){ return null; } };
  const draw=()=>{ $('#cExpr').textContent=CALC||'0'; const v=res(); $('#cRes').textContent = v===null? (CALC?'…':'') : '= '+calcFmt(v); };
  const press=k=>{ const last=CALC.slice(-1), ops='+−×÷';
    if(k==='C') CALC='';
    else if(k==='⌫') CALC=CALC.slice(0,-1);
    else if(k==='='){ const v=res(); if(v!==null) CALC=String(Math.round(v*100)/100); }
    else if(k==='( )'){ const open=(CALC.match(/\(/g)||[]).length-(CALC.match(/\)/g)||[]).length; CALC += (open>0 && /[\d)%]/.test(last))? ')' : (/[\d)%]/.test(last)? '×(' : '('); }
    else if(ops.includes(k)){ if(!CALC && k!=='−') return; if(ops.includes(last)) CALC=CALC.slice(0,-1); CALC+=k; }
    else if(k==='%'){ if(/[\d)]/.test(last)) CALC+='%'; }
    else if(k==='.'){ const seg=CALC.split(/[+−×÷()]/).pop(); if(seg.includes('.')) return; CALC += /\d/.test(last)? '.' : '0.'; }
    else { if(last==='%'||last===')') CALC+='×'; CALC+=k; }
    if(CALC.length>60) CALC=CALC.slice(0,60); draw(); };
  document.querySelectorAll('#sheet [data-k]').forEach(b=>b.onclick=()=>press(b.dataset.k));
  const kd=ev=>{ if(!$('#cExpr')){ document.removeEventListener('keydown',kd); return; } const m={'*':'×','/':'÷','-':'−','+':'+','Enter':'=','=':'=','Backspace':'⌫','Escape':null,'(':'( )',')':'( )','%':'%','.':'.',',':'.','c':'C','C':'C'};
    let k=/^\d$/.test(ev.key)? ev.key : m[ev.key]; if(k===undefined||k===null) return; ev.preventDefault(); press(k); };
  if(window.__calcKd) document.removeEventListener('keydown',window.__calcKd); window.__calcKd=kd; document.addEventListener('keydown',kd);
  $('#cCopy').onclick=async()=>{ const v=res(); if(v===null){ toast('Nothing to copy yet'); return; } const s2=(Math.round(v*100)/100).toFixed(2); try{ await navigator.clipboard.writeText(s2); toast('Copied '+s2); }catch(e){ toast('Result: '+s2); } };
  $('#cAdd').onclick=()=>{ const v=res(); if(v===null||!(v>0)){ toast('Work out a positive amount first'); return; } CALC=''; closeSheet(); openEntry(null,null,(Math.round(v*100)/100).toFixed(2)); };
  draw();
}
